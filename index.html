<!doctype html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Neon Obelisk Particle Sea</title>
	<style>
		* {
			box-sizing: border-box;
			margin: 0;
			padding: 0;
		}

		html,
		body {
			width: 100%;
			height: 100%;
			overflow: hidden;
			background: #000000;
		}

		#webgl {
			position: fixed;
			inset: 0;
			display: block;
			touch-action: none;
		}

		.support {
			position: fixed;
			left: 12px;
			right: 12px;
			bottom: 12px;
			padding: 10px 12px;
			border: 1px solid #2b3d51;
			border-radius: 10px;
			background: rgb(8 12 18 / 0.88);
			color: #c9d7e7;
			font: 13px/1.4 "Segoe UI", sans-serif;
		}

		.support.hidden {
			display: none;
		}

		.perf {
			position: fixed;
			top: 12px;
			right: 12px;
			padding: 8px 10px;
			border: 1px solid #1e3246;
			border-radius: 8px;
			background: rgb(5 10 16 / 0.8);
			color: #9dc9ec;
			font: 11px/1.3 "Segoe UI", sans-serif;
			letter-spacing: 0.02em;
			white-space: nowrap;
			pointer-events: none;
		}

		.perf.hidden {
			display: none;
		}

		.tuner {
			position: fixed;
			left: 12px;
			top: 12px;
			max-width: min(92vw, 580px);
			padding: 10px 12px;
			border: 1px solid #1f3346;
			border-radius: 8px;
			background: rgb(5 10 16 / 0.84);
			color: #95bedf;
			font: 11px/1.4 "Segoe UI", sans-serif;
			letter-spacing: 0.02em;
			white-space: pre-line;
		}

		.tuner.hidden {
			display: none;
		}
	</style>
</head>
<body>
	<canvas id="webgl" aria-label="Golden particle ocean scene"></canvas>
	<div id="support" class="support hidden"></div>
	<div id="perf" class="perf"></div>
	<div id="tuner" class="tuner hidden"></div>

	<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/Pass.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/FXAAShader.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/utils/BufferGeometryUtils.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
	<script>
		(() => {
			const canvas = document.getElementById("webgl");
			const support = document.getElementById("support");
			const perf = document.getElementById("perf");
			const tuner = document.getElementById("tuner");
			const isTouch = window.matchMedia("(pointer: coarse)").matches;
			const ua = navigator.userAgent || "";
			const isIOS = /iPad|iPhone|iPod/.test(ua);
			const isAndroid = /Android/.test(ua);
			const shortSide = Math.min(window.screen.width, window.screen.height);
			const longSide = Math.max(window.screen.width, window.screen.height);
			const isIPhoneX = /iPhone/.test(ua) && shortSide === 375 && longSide === 812 && window.devicePixelRatio >= 2.8;
			const isLowSpecMobile = isTouch && (isIOS || isAndroid);
			const desktopCores = navigator.hardwareConcurrency || 8;

				const BASE_PIXEL_RATIO_CAP = isIPhoneX ? 0.74 : isLowSpecMobile ? 0.98 : isTouch ? 1.32 : 1.9;
				const OCEAN_GRID_X = isIPhoneX ? 160 : isLowSpecMobile ? 220 : isTouch ? 320 : 450;
				const OCEAN_GRID_Z = isIPhoneX ? 96 : isLowSpecMobile ? 130 : isTouch ? 180 : 252;
				const BASE_BLOOM_SCALE = isIPhoneX ? 0.58 : isLowSpecMobile ? 0.72 : isTouch ? 0.84 : 0.82;
				const BLOOM_STRENGTH = isIPhoneX ? 1.68 : isLowSpecMobile ? 2.0 : isTouch ? 2.32 : 2.25;
				const BLOOM_RADIUS = isIPhoneX ? 0.28 : isLowSpecMobile ? 0.36 : isTouch ? 0.46 : 0.5;
				const BLOOM_THRESHOLD = isIPhoneX ? 0.68 : isLowSpecMobile ? 0.58 : isTouch ? 0.48 : 0.5;
				const USE_MICRO_LAYER = !isTouch && desktopCores >= 8;
				const POINT_SIZE_SCALE = isIPhoneX ? 0.84 : isLowSpecMobile ? 0.94 : isTouch ? 1.04 : 1.12;
				const SHAFT_COUNT = isIPhoneX ? 1 : isLowSpecMobile ? 2 : 3;
				const CURSOR_RADIUS = isTouch ? 0.4 : 0.38;
				const CURSOR_STRENGTH = isTouch ? 0.84 : 0.78;
				const CURSOR_SMOOTHING = isTouch ? 0.16 : 0.18;
				const CURSOR_RETURN = isTouch ? 0.018 : 0.025;
				const CURSOR_VEL_DAMP = isTouch ? 0.88 : 0.9;
				const FXAA_STRENGTH = isTouch ? 1.0 : 1.24;
				const WOMP_VERTEX_WELD_TOLERANCE = 1e-4;
				const SHOW_PERF_OVERLAY = false;
			const REQUIRED_POSTPROCESSING_SYMBOLS = [
				"Pass",
				"ShaderPass",
				"EffectComposer",
				"RenderPass",
				"CopyShader",
				"FXAAShader",
				"BufferGeometryUtils",
				"LuminosityHighPassShader",
				"UnrealBloomPass"
			];

			let renderer;
			let scene;
			let camera;
			let composer;
			let bloomPass;
			let cinematicPass;
			let fxaaPass;
			let raycaster;
			let useComposer = true;
				let canUsePostprocessing = true;
				let coreMaterial;
				let hazeMaterial;
				let microMaterial;
				let shaftGroup;
			let clock;
			let cameraBase;
			let cameraTarget;
			let obeliskA;
			let obeliskB;
			let logoWrapper;
			let logoBaseScale = 1;
			let logoRotationTarget = 0;
			let pixelRatioCap = BASE_PIXEL_RATIO_CAP;
			let bloomScale = BASE_BLOOM_SCALE;
			let showPerfOverlay = SHOW_PERF_OVERLAY;
			const logoMeshes = [];
			const logoMaterials = [];
			const perfState = {
				lastFrameTime: performance.now(),
				sampleMs: 0,
				sampleFrames: 0,
				totalMs: 0,
				totalFrames: 0,
				fps: 0,
				qualityTier: "balanced",
				qualitySettled: false,
				particleCount: 0
			};
			const logoPose = {
				px: -0.130,
				py: 0.120,
				pz: -0.620,
				rx: -0.612,
				ry: 6.720,
				rz: 0.353
			};
			const pointerState = {
				x: 0.5,
				y: 0.5,
				targetX: 0.5,
				targetY: 0.5,
				ndcX: 0,
				ndcY: 0,
				vx: 0,
				vy: 0,
				smoothVx: 0,
				smoothVy: 0,
				speed: 0,
				swirl: 0,
				influence: 0,
				pressing: false,
				lastTs: performance.now(),
				active: false,
				events: 0
			};
			const logoInteraction = {
				hover: 0,
				targetHover: 0,
				localX: 0,
				localY: 0,
				targetLocalX: 0,
				targetLocalY: 0
			};
			let poseEditMode = false;

			const oceanVertexShader = `
				precision highp float;

				uniform float u_time;
				uniform float u_pointSize;
				uniform vec2 u_obeliskA;
				uniform vec2 u_obeliskB;
				uniform float u_layer;
				uniform vec2 u_cursor;
				uniform vec2 u_cursorVelocity;
				uniform float u_cursorRadius;
				uniform float u_cursorStrength;
				uniform float u_breezeTime;
				uniform float u_pointerSpeed;
				uniform float u_pointerSwirl;
				uniform float u_cursorInfluence;
					attribute float aSeed;

					varying float vImpact;
					varying float vCrest;
					varying float vDepth;
					varying float vSeed;
					varying float vTwinkle;
					varying float vHover;
					varying float vCore;
					varying float vTendril;
					varying float vStream;
					varying float vSpray;

				vec3 mod289(vec3 x) {
					return x - floor(x * (1.0 / 289.0)) * 289.0;
				}

				vec4 mod289(vec4 x) {
					return x - floor(x * (1.0 / 289.0)) * 289.0;
				}

				vec4 permute(vec4 x) {
					return mod289(((x * 34.0) + 1.0) * x);
				}

				vec4 taylorInvSqrt(vec4 r) {
					return 1.79284291400159 - 0.85373472095314 * r;
				}

				float snoise(vec3 v) {
					const vec2 C = vec2(1.0 / 6.0, 1.0 / 3.0);
					const vec4 D = vec4(0.0, 0.5, 1.0, 2.0);

					vec3 i = floor(v + dot(v, C.yyy));
					vec3 x0 = v - i + dot(i, C.xxx);
					vec3 g = step(x0.yzx, x0.xyz);
					vec3 l = 1.0 - g;
					vec3 i1 = min(g.xyz, l.zxy);
					vec3 i2 = max(g.xyz, l.zxy);

					vec3 x1 = x0 - i1 + C.xxx;
					vec3 x2 = x0 - i2 + C.yyy;
					vec3 x3 = x0 - D.yyy;

					i = mod289(i);
					vec4 p = permute(
						permute(
							permute(i.z + vec4(0.0, i1.z, i2.z, 1.0))
							+ i.y + vec4(0.0, i1.y, i2.y, 1.0)
						)
						+ i.x + vec4(0.0, i1.x, i2.x, 1.0)
					);

					float n_ = 1.0 / 7.0;
					vec3 ns = n_ * D.wyz - D.xzx;
					vec4 j = p - 49.0 * floor(p * ns.z * ns.z);
					vec4 x_ = floor(j * ns.z);
					vec4 y_ = floor(j - 7.0 * x_);
					vec4 x = x_ * ns.x + ns.yyyy;
					vec4 y = y_ * ns.x + ns.yyyy;
					vec4 h = 1.0 - abs(x) - abs(y);

					vec4 b0 = vec4(x.xy, y.xy);
					vec4 b1 = vec4(x.zw, y.zw);
					vec4 s0 = floor(b0) * 2.0 + 1.0;
					vec4 s1 = floor(b1) * 2.0 + 1.0;
					vec4 sh = -step(h, vec4(0.0));
					vec4 a0 = b0.xzyw + s0.xzyw * sh.xxyy;
					vec4 a1 = b1.xzyw + s1.xzyw * sh.zzww;

					vec3 p0 = vec3(a0.xy, h.x);
					vec3 p1 = vec3(a0.zw, h.y);
					vec3 p2 = vec3(a1.xy, h.z);
					vec3 p3 = vec3(a1.zw, h.w);

					vec4 norm = taylorInvSqrt(vec4(
						dot(p0, p0),
						dot(p1, p1),
						dot(p2, p2),
						dot(p3, p3)
					));

					p0 *= norm.x;
					p1 *= norm.y;
					p2 *= norm.z;
					p3 *= norm.w;

					vec4 m = max(0.6 - vec4(
						dot(x0, x0),
						dot(x1, x1),
						dot(x2, x2),
						dot(x3, x3)
					), 0.0);
					m *= m;

					return 42.0 * dot(m * m, vec4(
						dot(p0, x0),
						dot(p1, x1),
						dot(p2, x2),
						dot(p3, x3)
					));
				}

				float fbm(vec3 p) {
					float value = 0.0;
					float amplitude = 0.5;
					value += amplitude * snoise(p);
					p *= 2.02;
					amplitude *= 0.5;
					value += amplitude * snoise(p);
					p *= 2.11;
					amplitude *= 0.5;
					value += amplitude * snoise(p);
					p *= 2.23;
					amplitude *= 0.5;
					value += amplitude * snoise(p);
					return value;
				}

					void main() {
						vec3 p = position;
						vec2 domain = p.xz * 0.148;
						float t = u_time * 0.1;
						vec2 drift = vec2(t * 0.48, -t * 0.27);

						float low = fbm(vec3(domain + drift, t * 0.19));
						float high = fbm(vec3(domain * 1.66 - drift * 1.22 + vec2(7.2, -3.4), t * 0.52 + aSeed * 1.43));
						float micro = snoise(vec3(domain * 3.1 + vec2(aSeed * 3.3, aSeed * 2.3), t * 0.9)) * 0.041;
						float wave = low * 0.8 + high * 0.3 + micro;

						vec2 flowDir = normalize(vec2(-0.5, -0.87));
						vec2 crossDir = vec2(-flowDir.y, flowDir.x);
						float streamCoord = dot(p.xz, flowDir);
						float crossCoord = dot(p.xz, crossDir);
						float flowTime = u_breezeTime * 0.9;
						float riverNoise = fbm(vec3(vec2(streamCoord * 0.24 + flowTime * 0.34, crossCoord * 0.48), t * 0.2));
						float mainRibbon = 1.0 - smoothstep(0.08, 1.24, abs(crossCoord + sin(streamCoord * 0.42 - flowTime * 1.42) * 0.56 + riverNoise * 0.58));
						float sideRibbon = 1.0 - smoothstep(0.04, 0.62, abs(crossCoord - 1.05 + sin(streamCoord * 0.58 - flowTime * 1.18 + 1.6) * 0.34));
						float flowPulse = 0.55 + 0.45 * sin(streamCoord * 1.35 - flowTime * 3.1 + aSeed * 6.2831853);
						float streamMask = clamp(max(mainRibbon, sideRibbon * 0.72) * (0.58 + flowPulse * 0.66), 0.0, 1.0);
						float breezeBand = fbm(vec3(domain * 0.34 + flowDir * (u_breezeTime * 0.62), t * 0.18));
						float breezeMask = smoothstep(-0.2, 0.64, breezeBand + high * 0.12);
						streamMask = clamp(streamMask + breezeMask * 0.18, 0.0, 1.0);
						float globalPush = 0.05 + (0.5 + 0.5 * sin(u_breezeTime * 0.62)) * 0.045;
						float streamPush = globalPush + streamMask * (0.11 + flowPulse * 0.13);

						p.x += flowDir.x * streamPush;
						p.z += flowDir.y * streamPush;
						p.x += crossDir.x * (wave * 0.018 + streamMask * sin(streamCoord * 0.9 - flowTime * 2.4) * 0.055);
						p.z += crossDir.y * (wave * 0.018 + streamMask * sin(streamCoord * 0.9 - flowTime * 2.4) * 0.055);

					vec4 probeClip = projectionMatrix * modelViewMatrix * vec4(p, 1.0);
					vec2 screenUv = probeClip.xy / max(0.0001, probeClip.w) * 0.5 + 0.5;
					float screenRiverLine = 0.02 + screenUv.x * 0.74 + sin(screenUv.x * 9.0 - flowTime * 1.8) * 0.035;
					float screenRiver = 1.0 - smoothstep(0.035, 0.19, abs(screenUv.y - screenRiverLine));
					screenRiver *= smoothstep(-0.05, 0.12, screenUv.x) * (1.0 - smoothstep(0.78, 1.08, screenUv.x));
					streamMask = clamp(max(streamMask, screenRiver * (0.72 + flowPulse * 0.36)), 0.0, 1.0);
					p.x += flowDir.x * screenRiver * 0.08;
					p.z += flowDir.y * screenRiver * 0.08;
					vec2 away = screenUv - u_cursor;
					float cursorDist = length(away);
					float hoverMask = 1.0 - smoothstep(0.0, u_cursorRadius, cursorDist);
					float cursorInfluence = clamp(0.24 + u_cursorInfluence * 1.08, 0.0, 1.45);
					hoverMask = pow(max(hoverMask, 0.0), 1.18) * cursorInfluence;
					vec2 repelDir = cursorDist > 0.0001 ? away / cursorDist : vec2(0.0);
					float cursorVelMag = clamp(length(u_cursorVelocity), 0.0, 1.0);
					float speedBias = smoothstep(0.06, 0.78, u_pointerSpeed);
					float swirlBias = clamp(abs(u_pointerSwirl), 0.0, 1.0);
					float coreMask = clamp(pow(hoverMask, 1.15) * (0.36 + speedBias * 1.04), 0.0, 1.0);
					float tendrilMask = clamp((1.0 - coreMask) * (0.26 + speedBias * 0.96) * (0.34 + breezeMask * 0.76), 0.0, 1.0);
					float whip = smoothstep(0.42, 0.96, u_pointerSpeed);
					float breeze = 0.5 + 0.5 * sin(u_breezeTime + p.x * 0.19 + p.z * 0.23 + aSeed * 6.2831853);
					vec2 screenFlowDir = cursorVelMag > 0.0001 ? normalize(u_cursorVelocity) : repelDir;
					vec2 worldFlowDir = cursorVelMag > 0.0001 ? normalize(vec2(u_cursorVelocity.x, -u_cursorVelocity.y)) : repelDir;
					float flowDot = dot(repelDir, screenFlowDir);
					float aheadMask = smoothstep(-0.25, 0.78, flowDot);
					float behindMask = smoothstep(-0.22, 0.9, -flowDot);
					float scoopMask = clamp(pow(hoverMask, 0.72) * (0.36 + cursorVelMag * 1.34), 0.0, 1.0);
					float wakeMask = clamp(pow(hoverMask, 0.68) * speedBias * (0.4 + behindMask * 1.18), 0.0, 1.0);
					float brushMask = clamp(pow(hoverMask, 0.82) * (0.62 + cursorVelMag * 1.02), 0.0, 1.0);
					float repel = u_cursorStrength * pow(hoverMask, 1.0) * (0.44 + breeze * 0.17) * (0.8 - speedBias * 0.2);
					float scoopPull = u_cursorStrength * scoopMask * aheadMask * (0.16 + cursorVelMag * 0.44);
					float throwPush = u_cursorStrength * (brushMask * 0.28 + wakeMask * 0.66 + scoopMask * behindMask * 0.46) * (0.46 + cursorVelMag * 1.18);
					vec2 swirlDir = vec2(-repelDir.y, repelDir.x) * sign(u_pointerSwirl + 0.0001);

					p.x += repelDir.x * repel;
					p.z += repelDir.y * repel;
					p.x -= repelDir.x * scoopPull;
					p.z -= repelDir.y * scoopPull;
					p.x += worldFlowDir.x * throwPush;
					p.z += worldFlowDir.y * throwPush;
					p.x += u_cursorVelocity.x * hoverMask * u_cursorStrength * (0.082 + whip * 0.22);
					p.z += -u_cursorVelocity.y * hoverMask * u_cursorStrength * (0.082 + whip * 0.22);
					p.x += swirlDir.x * hoverMask * (0.01 + swirlBias * 0.036) * (0.42 + speedBias * 0.5);
					p.z += swirlDir.y * hoverMask * (0.01 + swirlBias * 0.036) * (0.42 + speedBias * 0.5);
					p.y += hoverMask * u_cursorStrength * (0.038 + breeze * 0.032 + throwPush * 0.26 + behindMask * 0.08);

					vec2 fieldA = (p.xz - u_obeliskA) * vec2(1.12, 1.38);
					vec2 fieldB = (p.xz - u_obeliskB) * vec2(1.12, 1.38);
					float impactA = 1.0 - smoothstep(0.05, 1.34, length(fieldA));
					float impactB = 1.0 - smoothstep(0.05, 1.34, length(fieldB));
					float impactCore = pow(max(impactA, impactB), 1.3);
					float rimA = 1.0 - smoothstep(0.08, 0.38, abs(length(fieldA) - 0.32));
					float rimB = 1.0 - smoothstep(0.08, 0.38, abs(length(fieldB) - 0.32));
					float rimBurst = max(rimA, rimB);
					float jetPulse = 0.5 + 0.5 * sin(u_breezeTime * 1.05 + streamCoord * 0.62);
					float collision = clamp(impactCore * (0.5 + streamMask * 0.86) + rimBurst * (0.12 + jetPulse * 0.14), 0.0, 1.0);
					float spray = clamp(pow(collision, 1.28) * (0.5 + flowPulse * 0.42 + jetPulse * 0.08), 0.0, 0.88);
					vec2 impactVec = fieldA * impactA + fieldB * impactB;
					vec2 obstacleNormal = length(impactVec) > 0.0001 ? normalize(impactVec) : flowDir;
					vec2 obstacleTangent = vec2(-obstacleNormal.y, obstacleNormal.x);
					if (dot(obstacleTangent, flowDir) < 0.0) obstacleTangent *= -1.0;

					vec2 seamAxis = normalize(vec2(0.18, 1.0));
					float seamDist = abs(dot(p.xz, vec2(seamAxis.y, -seamAxis.x)));
					float bridge = 1.0 - smoothstep(0.02, 0.48, seamDist);

					float impact = max(max(impactA, impactB), bridge * 0.42);
					impact = pow(impact, 1.45);

					float outwardPush = spray * (0.12 + streamMask * 0.12);
					float sideSlip = spray * (0.22 + jetPulse * 0.08);
					float downstreamCarry = spray * (0.08 + streamMask * 0.12);
					p.x += obstacleNormal.x * outwardPush;
					p.z += obstacleNormal.y * outwardPush;
					p.x += obstacleTangent.x * sideSlip;
					p.z += obstacleTangent.y * sideSlip;
					p.x += flowDir.x * downstreamCarry;
					p.z += flowDir.y * downstreamCarry;
					p.x += crossDir.x * (impactA - impactB) * (streamMask * 0.09 + rimBurst * 0.05);
					p.z += crossDir.y * (impactA - impactB) * (streamMask * 0.09 + rimBurst * 0.05);

					float crest = smoothstep(0.04, 0.58, wave + streamMask * 0.4 + breezeMask * 0.24 + impact * 0.5 + high * 0.28 + spray * 0.58 + rimBurst * 0.14 + coreMask * 0.18 + tendrilMask * 0.1);

					p.y += wave * (0.06 + impact * 0.13);
					p.y += impact * 0.07;
					p.y += streamMask * 0.075 + spray * (0.34 + rimBurst * 0.12 + jetPulse * 0.08);

						vImpact = impact;
						vCrest = crest;
						vSeed = aSeed;
						vTwinkle = 0.72 + 0.28 * sin(u_time * (0.55 + aSeed * 1.7) + aSeed * 23.0);
						vHover = hoverMask * (0.8 + cursorVelMag * 0.2);
						vCore = coreMask;
						vTendril = tendrilMask;
						vStream = streamMask;
						vSpray = min(0.92, spray + rimBurst * 0.12);

					vec4 mvPosition = modelViewMatrix * vec4(p, 1.0);
					vDepth = clamp((-mvPosition.z - 0.8) / 11.0, 0.0, 1.0);
					gl_Position = projectionMatrix * mvPosition;

						float perspective = 32.0 / max(1.0, -mvPosition.z);

				grad.addColorStop(0.36, "rgba(255,255,255,0.75)");

				const fpsText = perfState.fps > 0 ? perfState.fps.toFixed(0) : "--";
				const dprText = renderer ? renderer.getPixelRatio().toFixed(2) : "--";
				const particles = perfState.particleCount > 0 ? perfState.particleCount.toLocaleString() : "--";
				const suffix = note ? ` | ${note}` : "";
				perf.textContent = `FPS ${fpsText} | DPR ${dprText} | cap ${pixelRatioCap.toFixed(2)} | bloom ${bloomScale.toFixed(2)} | pts ${particles} | ${perfState.qualityTier}${suffix}`;

			function updateCinematicResolution() {
				if (!renderer || !cinematicPass || !cinematicPass.material?.uniforms?.u_resolution) return;
				const pixelRatio = renderer.getPixelRatio();
				cinematicPass.material.uniforms.u_resolution.value.set(
					Math.max(1, Math.floor(window.innerWidth * pixelRatio)),
					Math.max(1, Math.floor(window.innerHeight * pixelRatio))

				const pixelRatio = renderer.getPixelRatio();
				const invW = 1 / Math.max(1, Math.floor(window.innerWidth * pixelRatio));
				const invH = 1 / Math.max(1, Math.floor(window.innerHeight * pixelRatio));

				renderer.setSize(window.innerWidth, window.innerHeight);

				if (useComposer && composer && bloomPass) {
					if (typeof composer.setPixelRatio === "function") {
						composer.setPixelRatio(renderPixelRatio);

					composer.setSize(window.innerWidth, window.innerHeight);
					bloomPass.setSize(
						Math.max(1, Math.floor(window.innerWidth * bloomScale)),
						Math.max(1, Math.floor(window.innerHeight * bloomScale))

				const rightX = worldBounds.max.x - width * 0.29;

					new THREE.Vector3(min.x, min.y, max.z),

				if (!logoWrapper) return;

				logoInteraction.hover = 0;
				logoInteraction.targetHover = 0;
				logoWrapper.position.set(logoPose.px, logoPose.py, logoPose.pz);
				logoWrapper.rotation.set(logoPose.rx, logoPose.ry, logoPose.rz);
				logoWrapper.scale.setScalar(logoBaseScale);

				logoMaterials.forEach((material) => {
					material.roughness = 0.38;
					material.clearcoat = 0.78;
					material.emissiveIntensity = 0.035;
				});
			}

			function detectWebGLIssue() {
				if (!window.WebGLRenderingContext) {
					return "WebGL is not available in this browser.";
				}

				const probe = document.createElement("canvas");
				const context =
					probe.getContext("webgl", { antialias: false, alpha: false })
					|| probe.getContext("experimental-webgl");

				if (!context) {
					return "WebGL context creation failed.";
				}

				const loseContext = context.getExtension("WEBGL_lose_context");
				if (loseContext) {
					loseContext.loseContext();
				}

				return null;
			}

			function getMissingPostprocessingSymbols() {
				return REQUIRED_POSTPROCESSING_SYMBOLS.filter((symbol) => typeof THREE[symbol] === "undefined");
			}

			function runStartupChecks() {
				if (!window.THREE || typeof THREE.WebGLRenderer === "undefined") {
					return {
						ok: false,
						fatalMessage: "Three.js core script is missing. Check that three.min.js is reachable."
					};
				}

				const webglIssue = detectWebGLIssue();
				if (webglIssue) {
					return {
						ok: false,
						fatalMessage: `${webglIssue} Open this page in a system browser with hardware acceleration enabled.`
					};
				}

				const missingSymbols = getMissingPostprocessingSymbols();
				canUsePostprocessing = missingSymbols.length === 0;

				if (!canUsePostprocessing) {
					showSupportMessage(
						`Bloom disabled: missing Three.js postprocessing symbols (${missingSymbols.join(", ")}).`
					);
					console.warn("Post-processing scripts missing. Falling back to direct render.", missingSymbols);
				}

				return { ok: true };
			}

			function initStaticVectors() {
				clock = new THREE.Clock();
					raycaster = new THREE.Raycaster();
					cameraBase = new THREE.Vector3(7.14, 1.56, 7.64);
					cameraTarget = new THREE.Vector3(0.42, 0.36, -0.06);
				obeliskA = new THREE.Vector2(-0.56, 0.12);
				obeliskB = new THREE.Vector2(0.38, -0.08);
			}

			function initRenderer() {
				renderer = new THREE.WebGLRenderer({
					canvas,
					antialias: !isLowSpecMobile,
					alpha: false,
					precision: "highp",
					powerPreference: "high-performance"
				});
				renderer.outputEncoding = THREE.sRGBEncoding;
				renderer.toneMapping = THREE.ACESFilmicToneMapping;
				renderer.toneMappingExposure = 1.14;
				renderer.setClearColor(0x170602, 1);
				applyRenderQuality();
			}

			function initScene() {
				scene = new THREE.Scene();
				scene.background = new THREE.Color(0x170602);
				scene.fog = new THREE.FogExp2(0x341304, 0.021);

				camera = new THREE.PerspectiveCamera(35, window.innerWidth / window.innerHeight, 0.1, 80);
				camera.position.copy(cameraBase);
				camera.lookAt(cameraTarget);
			}

			function addLighting() {
				const downKey = new THREE.DirectionalLight(0xffcc8a, 0.76);
				downKey.position.set(-0.8, 9.5, -1.2);
				downKey.target.position.set(0, 0, 0);
				scene.add(downKey);
				scene.add(downKey.target);

				const rim = new THREE.DirectionalLight(0xff8a1f, 2.32);
				rim.position.set(-5.0, 2.8, -3.9);
				scene.add(rim);

				const rearWarm = new THREE.DirectionalLight(0xff6a14, 0.96);
				rearWarm.position.set(4.4, 1.9, -4.8);
				scene.add(rearWarm);

				const frontFill = new THREE.DirectionalLight(0xa34e1a, 0.3);
				frontFill.position.set(3.3, 1.35, 2.8);
				scene.add(frontFill);

				const sky = new THREE.HemisphereLight(0xffa74f, 0x160602, 0.17);
				scene.add(sky);

				const warmAmbient = new THREE.AmbientLight(0x2f1204, 0.052);
				scene.add(warmAmbient);
			}

			function createFallbackObelisks() {
				const leftGeom = new THREE.BoxGeometry(0.84, 2.75, 0.58);
				const rightGeom = new THREE.BoxGeometry(0.98, 3.9, 0.68);
				const mat = new THREE.MeshStandardMaterial({
					color: 0x000000,
					roughness: 0.8,
					metalness: 0.2
				});

				const left = new THREE.Mesh(leftGeom, mat);
				left.position.set(-0.56, 0.73, 0.12);
				left.rotation.z = -Math.PI * 0.25;
				left.rotation.y = Math.PI * 0.08;

				const right = new THREE.Mesh(rightGeom, mat);
				right.position.set(0.38, 1.06, -0.08);
				right.rotation.z = -Math.PI * 0.25;
				right.rotation.y = -Math.PI * 0.08;

				scene.add(left);
				scene.add(right);
			}

				function syncObeliskUniforms() {
					if (coreMaterial && coreMaterial.uniforms) {
						coreMaterial.uniforms.u_obeliskA.value.copy(obeliskA);
						coreMaterial.uniforms.u_obeliskB.value.copy(obeliskB);
					}
					if (hazeMaterial && hazeMaterial.uniforms) {
						hazeMaterial.uniforms.u_obeliskA.value.copy(obeliskA);
						hazeMaterial.uniforms.u_obeliskB.value.copy(obeliskB);
					}
					if (microMaterial && microMaterial.uniforms) {
						microMaterial.uniforms.u_obeliskA.value.copy(obeliskA);
						microMaterial.uniforms.u_obeliskB.value.copy(obeliskB);
					}
				}

			async function addLogoModel() {
				if (!THREE.GLTFLoader) {
					console.warn("GLTFLoader not available. Falling back to primitive obelisks.");
					createFallbackObelisks();
					return;
				}

				const loader = new THREE.GLTFLoader();
				await new Promise((resolve) => {
					loader.load(
						"./scene.glb",
						(gltf) => {
							const model = gltf.scene || gltf.scenes?.[0];
							if (!model) {
								createFallbackObelisks();
								resolve();
								return;
							}

							const bounds = new THREE.Box3().setFromObject(model);
							const center = new THREE.Vector3();
							const size = new THREE.Vector3();
							bounds.getCenter(center);
							bounds.getSize(size);

							model.traverse((child) => {
								if (!child.isMesh) return;
								child.castShadow = false;
								child.receiveShadow = false;
								child.frustumCulled = true;
									if (child.geometry) {
										// Womp exports can carry split vertices; welding then recomputing normals softens jagged silhouettes.
										let geometry = child.geometry;
										if (THREE.BufferGeometryUtils && THREE.BufferGeometryUtils.mergeVertices) {
											try {
												geometry = THREE.BufferGeometryUtils.mergeVertices(geometry, WOMP_VERTEX_WELD_TOLERANCE);
											} catch (error) {
												console.warn("Geometry welding skipped for mesh.", error);
											}
										}
										geometry.computeVertexNormals();
										geometry.normalizeNormals();
										child.geometry = geometry;
									}
									child.material = new THREE.MeshPhysicalMaterial({
										color: 0x090401,
										roughness: 0.38,
										metalness: 0.68,
										clearcoat: 0.78,
										clearcoatRoughness: 0.2,
										reflectivity: 0.7,
										emissive: 0x2a1002,
										emissiveIntensity: 0.035
									});
									logoMeshes.push(child);
									logoMaterials.push(child.material);
								});

							model.position.sub(center);

							logoWrapper = new THREE.Group();
							logoWrapper.add(model);

								const targetHeight = 3.34;
								logoBaseScale = targetHeight / Math.max(size.y, 0.001);
								logoWrapper.scale.setScalar(logoBaseScale);
								applyLogoPose();
							scene.add(logoWrapper);
								updateObeliskAnchorsFromLogo();

							resolve();
						},
						undefined,
						(error) => {
							console.warn("Model load failed, fallback obelisks enabled.", error);
							showSupportMessage(
								"Model could not be loaded via file://. Open this scene from a local server to use scene.glb."
							);
							createFallbackObelisks();
							resolve();
						}
					);
				});
			}

			function createOceanGridGeometry(width, depth, segX, segZ, jitter) {
				const geometry = new THREE.PlaneBufferGeometry(width, depth, segX, segZ);
				geometry.rotateX(-Math.PI * 0.5);

				const positions = geometry.attributes.position.array;
				const count = geometry.attributes.position.count;
				const seeds = new Float32Array(count);
				for (let i = 0; i < count; i += 1) {
					const i3 = i * 3;
					positions[i3] += (Math.random() - 0.5) * jitter;
					positions[i3 + 2] += (Math.random() - 0.5) * jitter;
					seeds[i] = Math.random();
				}
				geometry.attributes.position.needsUpdate = true;
				geometry.setAttribute("aSeed", new THREE.BufferAttribute(seeds, 1));
				return geometry;
			}

				function addParticleOcean() {
					const coreGeometry = createOceanGridGeometry(23.2, 14.6, OCEAN_GRID_X, OCEAN_GRID_Z, 0.028);
					const hazeGeometry = coreGeometry.clone();
					const microSegX = Math.max(32, Math.floor(OCEAN_GRID_X * 0.62));
					const microSegZ = Math.max(24, Math.floor(OCEAN_GRID_Z * 0.56));
					const microGeometry = USE_MICRO_LAYER
						? createOceanGridGeometry(23.2, 14.6, microSegX, microSegZ, 0.034)
						: null;

				coreMaterial = createOceanMaterial({
					pointSize: (isTouch ? 0.68 : 0.6) * POINT_SIZE_SCALE,
					layer: 0,
					alphaScale: 1.36,
					cursorRadius: CURSOR_RADIUS,
					cursorStrength: CURSOR_STRENGTH,
					colorDeep: "#5c2403",
					colorBright: "#ff9a27"
				});

					hazeMaterial = createOceanMaterial({
						pointSize: (isTouch ? 1.02 : 0.9) * POINT_SIZE_SCALE,
						layer: 1,
						alphaScale: 0.96,
						cursorRadius: CURSOR_RADIUS * 0.9,
						cursorStrength: CURSOR_STRENGTH * 0.82,
						colorDeep: "#3b1202",
						colorBright: "#ff7a18"
					});

					if (USE_MICRO_LAYER) {
						microMaterial = createOceanMaterial({
							pointSize: (isTouch ? 0.42 : 0.32) * POINT_SIZE_SCALE,
							layer: 2,
							alphaScale: 0.72,
							cursorRadius: CURSOR_RADIUS * 0.76,
							cursorStrength: CURSOR_STRENGTH * 0.58,
							colorDeep: "#743104",
							colorBright: "#ffb35a"
						});
					}

				const coreOcean = new THREE.Points(coreGeometry, coreMaterial);
				coreOcean.position.set(0, -0.62, 0);
				coreOcean.renderOrder = 2;

					const hazeOcean = new THREE.Points(hazeGeometry, hazeMaterial);
					hazeOcean.position.copy(coreOcean.position);
					hazeOcean.renderOrder = 1;

					scene.add(hazeOcean);
					scene.add(coreOcean);

					if (USE_MICRO_LAYER && microMaterial && microGeometry) {
						const microOcean = new THREE.Points(microGeometry, microMaterial);
						microOcean.position.copy(coreOcean.position);
						microOcean.renderOrder = 3;
						scene.add(microOcean);
					}

					perfState.particleCount = coreGeometry.attributes.position.count
						+ hazeGeometry.attributes.position.count
						+ (microGeometry ? microGeometry.attributes.position.count : 0);
					updatePerfHud();
				}

			function addAtmosphericShafts() {
				const shaftTex = createShaftTexture(64, 1024);
				shaftGroup = new THREE.Group();

				function createShaft(config) {
					const material = new THREE.MeshBasicMaterial({
						map: shaftTex,
						color: 0xb25a17,
						transparent: true,
						opacity: config.opacity,
						blending: THREE.AdditiveBlending,
						depthWrite: false,
						depthTest: true,
						side: THREE.DoubleSide
					});

					const shaft = new THREE.Mesh(new THREE.PlaneGeometry(config.w, config.h), material);
					shaft.position.set(config.x, config.y, config.z);
					shaft.rotation.y = config.ry;
					shaft.rotation.z = config.rz;
					shaft.userData.baseOpacity = config.opacity;
					shaft.userData.baseRz = config.rz;
					shaftGroup.add(shaft);
				}

					const shafts = [
						{ x: -1.9, y: 2.0, z: -2.6, w: 2.2, h: 5.8, ry: 0.28, rz: -0.19, opacity: 0.03 },
						{ x: -1.25, y: 1.9, z: -2.3, w: 1.8, h: 5.2, ry: 0.18, rz: -0.16, opacity: 0.022 },
						{ x: -0.6, y: 1.7, z: -2.0, w: 1.5, h: 4.6, ry: 0.12, rz: -0.12, opacity: 0.016 }
					];

				shafts.slice(0, SHAFT_COUNT).forEach((config) => createShaft(config));

				scene.add(shaftGroup);
			}

			function initComposer() {
				if (!canUsePostprocessing) {
					useComposer = false;
					composer = null;
					bloomPass = null;
					cinematicPass = null;
					fxaaPass = null;
					return;
				}

				try {
					let composerTarget = null;
					if (!isLowSpecMobile && renderer.capabilities?.isWebGL2 && THREE.WebGLMultisampleRenderTarget) {
						composerTarget = new THREE.WebGLMultisampleRenderTarget(
							window.innerWidth,
							window.innerHeight,
							{
								format: THREE.RGBAFormat,
								type: THREE.UnsignedByteType
							}
						);
						composerTarget.texture.encoding = THREE.sRGBEncoding;
						composerTarget.samples = isTouch ? 2 : 4;
					}

					composer = composerTarget
						? new THREE.EffectComposer(renderer, composerTarget)
						: new THREE.EffectComposer(renderer);
					if (typeof composer.setPixelRatio === "function") {
						composer.setPixelRatio(renderer.getPixelRatio());
					}
					composer.addPass(new THREE.RenderPass(scene, camera));

					bloomPass = new THREE.UnrealBloomPass(
						new THREE.Vector2(window.innerWidth, window.innerHeight),
						BLOOM_STRENGTH,
						BLOOM_RADIUS,
						BLOOM_THRESHOLD
					);
					composer.addPass(bloomPass);

					cinematicPass = new THREE.ShaderPass(cinematicGradeShader);
					composer.addPass(cinematicPass);
					updateCinematicResolution();

					fxaaPass = new THREE.ShaderPass(THREE.FXAAShader);
					composer.addPass(fxaaPass);
					updateFxaaResolution();

					useComposer = true;
					applyRenderQuality();
				} catch (error) {
					useComposer = false;
					composer = null;
					bloomPass = null;
					cinematicPass = null;
					fxaaPass = null;
					console.warn("Post-processing disabled.", error);
				}
			}

			function resize() {
				camera.aspect = window.innerWidth / window.innerHeight;
				camera.updateProjectionMatrix();
				applyRenderQuality();
			}

			function animate() {
				requestAnimationFrame(animate);

				const now = performance.now();
				const dt = now - perfState.lastFrameTime;
				perfState.lastFrameTime = now;
				perfState.sampleMs += dt;
				perfState.sampleFrames += 1;
				perfState.totalMs += dt;
				perfState.totalFrames += 1;

				if (perfState.sampleMs >= 500) {
					perfState.fps = (perfState.sampleFrames * 1000) / Math.max(1, perfState.sampleMs);
					perfState.sampleMs = 0;
					perfState.sampleFrames = 0;
					updatePerfHud();
				}

				settleAdaptiveQuality();
				updateCursorState();
				const cursorVelX = THREE.MathUtils.clamp(pointerState.smoothVx * 26.0 + pointerState.vx * 0.35, -2.4, 2.4);
				const cursorVelY = THREE.MathUtils.clamp(pointerState.smoothVy * 26.0 + pointerState.vy * 0.35, -2.4, 2.4);

					const t = clock.getElapsedTime();
					coreMaterial.uniforms.u_time.value = t;
					coreMaterial.uniforms.u_cursor.value.set(pointerState.x, pointerState.y);
					coreMaterial.uniforms.u_cursorVelocity.value.set(cursorVelX, cursorVelY);
					coreMaterial.uniforms.u_breezeTime.value = t * 0.65;
					coreMaterial.uniforms.u_pointerSpeed.value = pointerState.speed;
					coreMaterial.uniforms.u_pointerSwirl.value = pointerState.swirl;
					coreMaterial.uniforms.u_cursorInfluence.value = pointerState.influence;
					hazeMaterial.uniforms.u_time.value = t;
					hazeMaterial.uniforms.u_cursor.value.set(pointerState.x, pointerState.y);
					hazeMaterial.uniforms.u_cursorVelocity.value.set(cursorVelX, cursorVelY);
					hazeMaterial.uniforms.u_breezeTime.value = t * 0.65;
					hazeMaterial.uniforms.u_pointerSpeed.value = pointerState.speed;
					hazeMaterial.uniforms.u_pointerSwirl.value = pointerState.swirl;
					hazeMaterial.uniforms.u_cursorInfluence.value = pointerState.influence;
					if (microMaterial) {
						microMaterial.uniforms.u_time.value = t;
						microMaterial.uniforms.u_cursor.value.set(pointerState.x, pointerState.y);
						microMaterial.uniforms.u_cursorVelocity.value.set(cursorVelX, cursorVelY);
						microMaterial.uniforms.u_breezeTime.value = t * 0.65;
						microMaterial.uniforms.u_pointerSpeed.value = pointerState.speed;
						microMaterial.uniforms.u_pointerSwirl.value = pointerState.swirl;
						microMaterial.uniforms.u_cursorInfluence.value = pointerState.influence;
					}

				const cursorPanX = (pointerState.x - 0.5) * 2;
				const cursorPanY = (pointerState.y - 0.5) * 2;
				const cameraBreathX = Math.sin(t * 0.05) * 0.07;
				const cameraBreathY = Math.cos(t * 0.045) * 0.04;
				const cameraBreathZ = Math.cos(t * 0.055) * 0.06;

				camera.position.set(
					cameraBase.x + cameraBreathX + cursorPanX * 0.46,
					cameraBase.y + cameraBreathY + cursorPanY * 0.18,
					cameraBase.z + cameraBreathZ - cursorPanX * 0.18 - cursorPanY * 0.08
				);
				camera.lookAt(
					cameraTarget.x + cursorPanX * 0.18,
					cameraTarget.y + cursorPanY * 0.12,
					cameraTarget.z - cursorPanY * 0.08
				);

				if (logoWrapper) {
					updateLogoInteraction(t);
				}

				if (shaftGroup) {
					shaftGroup.children.forEach((shaft, index) => {
						shaft.material.opacity = shaft.userData.baseOpacity * (0.78 + 0.22 * Math.sin(t * 0.36 + index * 1.6));
						shaft.rotation.z = shaft.userData.baseRz + Math.sin(t * 0.14 + index) * 0.025;
					});
				}

				if (useComposer && composer) {
					composer.render();
				} else {
					renderer.render(scene, camera);
				}
			}

			async function boot() {
				const startup = runStartupChecks();
				if (!startup.ok) {
					throw new Error(startup.fatalMessage);
				}

				initStaticVectors();
				initRenderer();
				initScene();
				addLighting();
				await addLogoModel();
				addParticleOcean();
				syncObeliskUniforms();
				addAtmosphericShafts();
				initComposer();
				setPerfOverlayVisibility();
				window.addEventListener("keydown", onPoseKeydown);
				window.addEventListener("pointermove", onPointerMove, { passive: true });
				window.addEventListener("pointerdown", onPointerDown, { passive: true });
				window.addEventListener("pointerup", onPointerRelease, { passive: true });
				window.addEventListener("pointercancel", onPointerRelease, { passive: true });
				canvas.addEventListener("pointerleave", onPointerRelease, { passive: true });
				window.addEventListener("resize", resize);
				animate();
			}

			boot().catch((error) => {
				showSupportMessage(
					error && error.message
						? `This scene could not initialize. ${error.message}`
						: "This scene could not initialize. Verify WebGL support and required Three.js postprocessing scripts."
				);
				console.error(error);
			});
		})();
	</script>
</body>
</html>
