<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crater — cinematic god-ray scene</title>
    <style>
      html, body { margin: 0; height: 100%; background: #05070a; overflow: hidden; }
      #app { position: fixed; inset: 0; }
      /* Tiny loading hint that fades once the scene is up */
      #hint {
        position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%);
        font: 12px/1.4 ui-monospace, monospace; color: #6b7480; letter-spacing: .08em;
        pointer-events: none; transition: opacity 1.5s ease; opacity: .6;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hint">DRAG TO LOOK · SCROLL TO DOLLY</div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
