<!doctype html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Scroll Rotate · Particle Scene</title>
	<style>
		* { box-sizing: border-box; margin: 0; padding: 0; }

		:root {
			--bg-top: #000000;
			--bg-bottom: #0a0603;
			--accent: #f6b32c;
			--ink: #f5ead3;
		}

		html, body {
			width: 100%;
			background: linear-gradient(180deg, var(--bg-top) 0%, #050302 45%, var(--bg-bottom) 100%);
			color: var(--ink);
			font-family: "Avenir Next", "Trebuchet MS", system-ui, sans-serif;
		}

		/* Tall scroll track — this is what we scrub the rotation against. */
		.scroll-track { height: 500vh; }

		#webgl {
			position: fixed;
			inset: 0;
			width: 100vw;
			height: 100vh;
			display: block;
			z-index: 1;
			touch-action: pan-y;
		}

		/* Pinned overlay copy, bikebear-style. */
		.overlay {
			position: fixed;
			inset: 0;
			z-index: 2;
			pointer-events: none;
		}

		.hero {
			position: absolute;
			top: 7vh;
			left: 0;
			right: 0;
			text-align: center;
		}

		.hero .word {
			position: absolute;
			top: 0;
			left: 0;
			right: 0;
			font: 800 clamp(64px, 17vw, 280px)/0.9 "Arial Black", Impact, sans-serif;
			letter-spacing: -0.02em;
			text-transform: uppercase;
			color: #ffffff;
			opacity: 0;
			transform: translateY(28px);
			transition: opacity 0.5s ease, transform 0.5s ease;
			text-shadow: 0 0 60px rgb(246 179 44 / 0.18);
		}

		.hero .word.is-active { opacity: 1; transform: translateY(0); }

		.caption {
			position: absolute;
			right: clamp(20px, 5vw, 90px);
			top: 42vh;
			max-width: 22em;
			text-align: left;
			color: rgb(245 234 211 / 0.72);
			font: 500 clamp(13px, 1vw, 16px)/1.55 inherit;
			letter-spacing: 0.01em;
			opacity: 0;
			transition: opacity 0.6s ease;
		}

		.caption.is-active { opacity: 1; }

		.scroll-hint {
			position: fixed;
			left: 50%;
			bottom: 26px;
			transform: translateX(-50%);
			z-index: 3;
			color: rgb(245 234 211 / 0.6);
			font: 600 11px/1 inherit;
			letter-spacing: 0.28em;
			text-transform: uppercase;
			transition: opacity 0.4s ease;
		}

		.scroll-hint::after {
			content: "";
			display: block;
			width: 1px;
			height: 26px;
			margin: 10px auto 0;
			background: linear-gradient(180deg, var(--accent), transparent);
			animation: nudge 1.8s ease-in-out infinite;
		}

		@keyframes nudge {
			0%, 100% { opacity: 0.2; transform: translateY(-6px); }
			50% { opacity: 1; transform: translateY(2px); }
		}

		.progress {
			position: fixed;
			left: 0; right: 0; top: 0;
			height: 2px;
			z-index: 4;
			transform-origin: 0 50%;
			transform: scaleX(0);
			background: linear-gradient(90deg, var(--accent), #fff);
		}

		.notice {
			position: fixed;
			left: 50%;
			top: 50%;
			transform: translate(-50%, -50%);
			z-index: 5;
			padding: 14px 18px;
			max-width: min(86vw, 460px);
			border: 1px solid rgb(246 179 44 / 0.35);
			border-radius: 10px;
			background: rgb(8 5 2 / 0.92);
			color: var(--ink);
			font: 13px/1.5 inherit;
			text-align: center;
			display: none;
		}

		.notice.show { display: block; }
		.notice code { color: var(--accent); }

		/* --- control panel --- */
		.panel {
			position: fixed;
			top: 16px;
			right: 16px;
			z-index: 6;
			width: 248px;
			font: 11px/1.4 inherit;
			color: var(--ink);
			user-select: none;
		}

		.panel-toggle {
			width: 100%;
			padding: 9px 12px;
			border: 1px solid rgb(246 179 44 / 0.4);
			border-radius: 9px;
			background: rgb(10 6 2 / 0.82);
			color: var(--accent);
			font: 600 11px/1 inherit;
			letter-spacing: 0.16em;
			text-transform: uppercase;
			cursor: pointer;
			backdrop-filter: blur(6px);
		}

		.panel-body {
			margin-top: 8px;
			padding: 14px 14px 6px;
			border: 1px solid rgb(246 179 44 / 0.22);
			border-radius: 10px;
			background: rgb(8 5 2 / 0.86);
			backdrop-filter: blur(8px);
		}

		.panel.collapsed .panel-body { display: none; }

		.ctrl { margin-bottom: 14px; }

		.ctrl label {
			display: flex;
			justify-content: space-between;
			margin-bottom: 6px;
			color: rgb(245 234 211 / 0.78);
			letter-spacing: 0.04em;
		}

		.ctrl label .val { color: var(--accent); font-variant-numeric: tabular-nums; }

		.ctrl input[type="range"] {
			-webkit-appearance: none;
			appearance: none;
			width: 100%;
			height: 3px;
			border-radius: 3px;
			background: rgb(246 179 44 / 0.25);
			outline: none;
			cursor: pointer;
		}

		.ctrl input[type="range"]::-webkit-slider-thumb {
			-webkit-appearance: none;
			appearance: none;
			width: 14px;
			height: 14px;
			border-radius: 50%;
			background: var(--accent);
			box-shadow: 0 0 8px rgb(246 179 44 / 0.7);
		}

		.ctrl input[type="range"]::-moz-range-thumb {
			width: 14px;
			height: 14px;
			border: none;
			border-radius: 50%;
			background: var(--accent);
			box-shadow: 0 0 8px rgb(246 179 44 / 0.7);
		}
	</style>
</head>
<body>
	<canvas id="webgl"></canvas>

	<div class="overlay">
		<div class="hero" id="hero">
			<span class="word">BIGGER</span>
			<span class="word">BOLDER</span>
			<span class="word">FASTER</span>
		</div>
		<p class="caption" id="caption">
			Scroll to spin the scene. Particles orbit the core while it rotates,
			driven entirely by your scroll position.
		</p>
	</div>

	<div class="progress" id="progress"></div>
	<div class="scroll-hint" id="hint">Scroll</div>
	<div class="notice" id="notice"></div>

	<div class="panel" id="panel">
		<button class="panel-toggle" id="panelToggle">Controls</button>
		<div class="panel-body">
			<div class="ctrl">
				<label>Particles <span class="val" id="v-count">3000</span></label>
				<input type="range" id="s-count" min="300" max="9000" step="100" value="3000" />
			</div>
			<div class="ctrl">
				<label>Glow speed <span class="val" id="v-glow">0.50×</span></label>
				<input type="range" id="s-glow" min="0" max="4" step="0.05" value="0.5" />
			</div>
			<div class="ctrl">
				<label>Flake size <span class="val" id="v-size">25</span></label>
				<input type="range" id="s-size" min="8" max="90" step="1" value="25" />
			</div>
			<div class="ctrl">
				<label>Model size <span class="val" id="v-scale">4.0</span></label>
				<input type="range" id="s-scale" min="1.5" max="9" step="0.1" value="4.0" />
			</div>
			<div class="ctrl">
				<label>Rotation / scroll <span class="val" id="v-rot">-5.0</span></label>
				<input type="range" id="s-rot" min="-12" max="12" step="0.5" value="-5" />
			</div>
		</div>
	</div>

	<div class="scroll-track"></div>

	<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
	<script>
	(() => {
		const canvas = document.getElementById("webgl");
		const noticeEl = document.getElementById("notice");
		const progressEl = document.getElementById("progress");
		const hintEl = document.getElementById("hint");
		const heroWords = Array.from(document.querySelectorAll("#hero .word"));
		const captionEl = document.getElementById("caption");

		// --- scroll state -------------------------------------------------
		let scrollProgress = 0;     // 0..1 raw from scrollbar
		let easedProgress = 0;      // smoothed, drives rotation
		const pointer = { x: 0, y: 0, tx: 0, ty: 0 };

		// --- live-tunable config (driven by the control panel) ------------
		const config = {
			particleCount: 3000,
			particleSize: 25,       // base point size in px
			glowSpeed: 0.5,         // flake flutter + glint speed multiplier
			modelScale: 4.0,        // target size of the model
			rotationTurns: -5       // turns over a full scroll (negative reverses)
		};
		let flakeTime = 0;          // accumulated time scaled by glowSpeed

		function readScroll() {
			const max = document.documentElement.scrollHeight - window.innerHeight;
			scrollProgress = max > 0 ? Math.min(1, Math.max(0, window.scrollY / max)) : 0;
		}

		// --- renderer / scene --------------------------------------------
		const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
		renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
		renderer.setSize(window.innerWidth, window.innerHeight);
		renderer.outputEncoding = THREE.sRGBEncoding;
		renderer.toneMapping = THREE.ACESFilmicToneMapping;
		renderer.toneMappingExposure = 1.1;
		renderer.setClearColor(0x020108, 1);

		const scene = new THREE.Scene();
		scene.fog = new THREE.FogExp2(0x020108, 0.028);

		const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 100);
		camera.position.set(0, 0, 9);
		camera.lookAt(0, 0, 0);

		// Procedural environment — bright warm tones so the metallic surface
		// reflects gold light instead of mirroring a dark room.
		function buildEnvironment() {
			const c = document.createElement("canvas");
			c.width = 64; c.height = 256;
			const ctx = c.getContext("2d");
			const g = ctx.createLinearGradient(0, 0, 0, 256);
			g.addColorStop(0.0, "#fff3d6");   // bright sky
			g.addColorStop(0.35, "#ffcf7a");
			g.addColorStop(0.55, "#ffb43c");  // warm gold horizon
			g.addColorStop(0.7, "#8a4f16");
			g.addColorStop(1.0, "#1a0e04");   // dark floor
			ctx.fillStyle = g;
			ctx.fillRect(0, 0, 64, 256);
			const tex = new THREE.CanvasTexture(c);
			tex.mapping = THREE.EquirectangularReflectionMapping;
			const pmrem = new THREE.PMREMGenerator(renderer);
			const env = pmrem.fromEquirectangular(tex).texture;
			pmrem.dispose();
			tex.dispose();
			return env;
		}
		scene.environment = buildEnvironment();

		// --- lighting (warm key + cool rim for a glossy reference look) ---
		const key = new THREE.DirectionalLight(0xffe8c4, 3.2);
		key.position.set(4, 6, 5);
		scene.add(key);

		const rim = new THREE.DirectionalLight(0xff8a1f, 6.0);
		rim.position.set(-6, 2, -4);
		scene.add(rim);

		const rim2 = new THREE.DirectionalLight(0xffc85a, 4.0);
		rim2.position.set(6, 3, -5);
		scene.add(rim2);

		const fill = new THREE.DirectionalLight(0x9ab8ff, 1.6);
		fill.position.set(-3, -2, 4);
		scene.add(fill);

		scene.add(new THREE.AmbientLight(0x6b4a26, 1.8));

		// Two warm point lights orbiting the core — sweep glints across the
		// metal so it reads as a polished gold object as it rotates.
		const orbLightA = new THREE.PointLight(0xffd27a, 60, 30, 2);
		const orbLightB = new THREE.PointLight(0xff9a3c, 45, 30, 2);
		scene.add(orbLightA, orbLightB);

		// --- the rotating core group ------------------------------------
		const core = new THREE.Group();
		scene.add(core);

		// --- particles orbiting the core --------------------------------
		function buildParticles() {
			const COUNT = config.particleCount;
			const positions = new Float32Array(COUNT * 3);
			const seeds = new Float32Array(COUNT);
			const flake = new Float32Array(COUNT);   // 0 = dust mote, 1 = bright flake
			for (let i = 0; i < COUNT; i++) {
				// distribute in a thick spherical shell around the model
				const r = 2.6 + Math.random() * 7.0;
				const theta = Math.random() * Math.PI * 2;
				const phi = Math.acos(2 * Math.random() - 1);
				positions[i * 3 + 0] = r * Math.sin(phi) * Math.cos(theta);
				positions[i * 3 + 1] = (r * Math.cos(phi)) * 0.8;
				positions[i * 3 + 2] = r * Math.sin(phi) * Math.sin(theta);
				seeds[i] = Math.random();
				flake[i] = Math.random() < 0.4 ? 1.0 : 0.0;   // ~40% are bright glinting flakes
			}
			const geo = new THREE.BufferGeometry();
			geo.setAttribute("position", new THREE.BufferAttribute(positions, 3));
			geo.setAttribute("aSeed", new THREE.BufferAttribute(seeds, 1));
			geo.setAttribute("aFlake", new THREE.BufferAttribute(flake, 1));

			const mat = new THREE.ShaderMaterial({
				transparent: true,
				depthWrite: false,
				blending: THREE.AdditiveBlending,
				uniforms: {
					u_time: { value: 0 },
					u_size: { value: config.particleSize * renderer.getPixelRatio() },
					u_colorA: { value: new THREE.Color(0xb8761e) },  // deep gold
					u_colorB: { value: new THREE.Color(0xfff0c0) }   // bright gold-white
				},
				vertexShader: `
					uniform float u_time;
					uniform float u_size;
					attribute float aSeed;
					attribute float aFlake;
					varying float vFade;
					varying float vFlake;
					varying float vGlint;
					void main() {
						vec3 p = position;
						float t = u_time * (0.12 + aSeed * 0.4);
						// fluttering, drifting motion — flakes "fly"
						p.x += sin(t + aSeed * 6.28) * 0.6;
						p.y += cos(t * 0.7 + aSeed * 6.28) * 0.45 + sin(u_time * 0.08 + aSeed * 3.0) * 0.3;
						p.z += sin(t * 0.9 + aSeed * 4.0) * 0.6;
						vec4 mv = modelViewMatrix * vec4(p, 1.0);
						vFade = clamp((-mv.z) / 16.0, 0.0, 1.0);
						vFlake = aFlake;
						// sharp periodic glint — flakes catching the light
						float g = sin(u_time * (2.0 + aSeed * 5.0) + aSeed * 40.0);
						vGlint = aFlake * pow(max(g, 0.0), 8.0);
						gl_Position = projectionMatrix * mv;
						float twinkle = 0.5 + 0.5 * sin(u_time * (1.0 + aSeed * 3.0) + aSeed * 30.0);
						float baseSize = mix(0.35, 1.4, aSeed) * mix(0.8, 1.6, aFlake);
						gl_PointSize = u_size * baseSize * (twinkle * 0.6 + 0.4 + vGlint * 1.6) / max(1.0, -mv.z);
					}
				`,
				fragmentShader: `
					uniform vec3 u_colorA;
					uniform vec3 u_colorB;
					varying float vFade;
					varying float vFlake;
					varying float vGlint;
					void main() {
						vec2 uv = gl_PointCoord - 0.5;
						float d = dot(uv, uv);
						// flakes have a sharp bright core; dust is softer
						float sharp = mix(7.0, 26.0, vFlake);
						float soft = exp(-d * sharp);
						float core = exp(-d * 80.0);
						if (soft < 0.02 && core < 0.02) discard;
						vec3 col = mix(u_colorA, u_colorB, clamp(vFlake * 0.5 + vGlint + core, 0.0, 1.0));
						float a = soft * (0.22 + vFade * 0.6) + core * (0.4 + vGlint * 0.6);
						a *= (0.6 + vFade * 0.6);
						gl_FragColor = vec4(col, a);
					}
				`
			});

			const points = new THREE.Points(geo, mat);
			scene.add(points);
			return { points, mat };
		}
		let particles = buildParticles();

		function rebuildParticles() {
			scene.remove(particles.points);
			particles.points.geometry.dispose();
			particles.mat.dispose();
			particles = buildParticles();
		}

		// --- load the model (or fall back to a primitive) ----------------
		let modelReady = false;

		let coreMaxDim = 1;
		function frameCore() {
			// center the model, then size it via applyModelScale()
			const box = new THREE.Box3().setFromObject(core);
			const size = new THREE.Vector3();
			const center = new THREE.Vector3();
			box.getSize(size);
			box.getCenter(center);
			coreMaxDim = Math.max(size.x, size.y, size.z) || 1;
			core.children.forEach((c) => c.position.sub(center));
			applyModelScale();
		}

		function applyModelScale() {
			core.scale.setScalar(config.modelScale / coreMaxDim);
		}

		function addFallback() {
			const geo = new THREE.TorusKnotGeometry(1, 0.34, 180, 32);
			const mat = new THREE.MeshStandardMaterial({
				color: 0x0a0603, metalness: 0.9, roughness: 0.2,
				emissive: 0x140a02, emissiveIntensity: 0.4
			});
			core.add(new THREE.Mesh(geo, mat));
			frameCore();
			modelReady = true;
		}

		if (!THREE.GLTFLoader) {
			addFallback();
		} else {
			new THREE.GLTFLoader().load(
				"scene.glb",
				(gltf) => {
					const model = gltf.scene || gltf.scenes?.[0];
					if (!model) { addFallback(); return; }
					model.traverse((child) => {
						if (!child.isMesh) return;
						// Womp/GLB exports can ship without normals → all lighting
						// resolves to black. Recompute them so the surface lights up.
						if (child.geometry && !child.geometry.attributes.normal) {
							child.geometry.computeVertexNormals();
						}
						child.material = new THREE.MeshPhysicalMaterial({
							color: 0xc8862c,          // warm gold base
							metalness: 0.9,
							roughness: 0.34,
							clearcoat: 1.0,
							clearcoatRoughness: 0.18,
							reflectivity: 0.9,
							emissive: 0x6e3a0e,        // warm self-glow so it never goes black
							emissiveIntensity: 0.45,
							envMapIntensity: 2.6
						});
					});
					core.add(model);
					frameCore();
					modelReady = true;
				},
				undefined,
				() => {
					noticeEl.classList.add("show");
					noticeEl.innerHTML = "Couldn't load <code>scene.glb</code>. " +
						"Open this page from a local server (e.g. <code>python3 -m http.server</code>) " +
						"so the model can load. Showing a placeholder for now.";
					addFallback();
				}
			);
		}

		// --- overlay copy reacts to scroll sections -----------------------
		function updateOverlay(p) {
			progressEl.style.transform = `scaleX(${p})`;
			hintEl.style.opacity = p > 0.04 ? "0" : "1";
			captionEl.classList.toggle("is-active", p > 0.02 && p < 0.9);
			const active = Math.min(heroWords.length - 1, Math.floor(p * heroWords.length));
			heroWords.forEach((w, i) => w.classList.toggle("is-active", i === active));
		}

		// --- render loop --------------------------------------------------
		const clock = new THREE.Clock();
		let lastElapsed = 0;
		function tick() {
			const t = clock.getElapsedTime();
			const dt = Math.min(0.05, t - lastElapsed);
			lastElapsed = t;
			flakeTime += dt * config.glowSpeed;   // glow/flake speed slider

			// smooth the scroll value for inertial rotation
			easedProgress += (scrollProgress - easedProgress) * 0.08;
			pointer.x += (pointer.tx - pointer.x) * 0.05;
			pointer.y += (pointer.ty - pointer.y) * 0.05;

			if (modelReady) {
				// scroll scrubs rotationTurns full turns; pointer adds parallax tilt
				core.rotation.y = easedProgress * Math.PI * config.rotationTurns + pointer.x * 0.4;
				core.rotation.x = Math.sin(easedProgress * Math.PI * 2) * 0.25 - pointer.y * 0.25;
				core.position.y = Math.sin(t * 0.6) * 0.12;
			}

			// orbit the warm point lights so glints sweep across the gold
			orbLightA.position.set(Math.cos(t * 0.6) * 5, Math.sin(t * 0.4) * 3 + 1, Math.sin(t * 0.6) * 5);
			orbLightB.position.set(Math.cos(t * 0.5 + 2.1) * 4.5, Math.cos(t * 0.3) * 3, Math.sin(t * 0.5 + 2.1) * 4.5);

			// particles slowly counter-rotate and react to scroll
			particles.points.rotation.y = -easedProgress * Math.PI * 1.5 - t * 0.02;
			particles.mat.uniforms.u_time.value = flakeTime;

			// gentle camera dolly through the scroll
			camera.position.z = 9 - easedProgress * 2.2;
			camera.position.x = pointer.x * 0.6;
			camera.position.y = pointer.y * 0.4;
			camera.lookAt(0, 0, 0);

			updateOverlay(easedProgress);

			renderer.render(scene, camera);
			requestAnimationFrame(tick);
		}

		// --- events -------------------------------------------------------
		window.addEventListener("scroll", readScroll, { passive: true });
		window.addEventListener("resize", () => {
			camera.aspect = window.innerWidth / window.innerHeight;
			camera.updateProjectionMatrix();
			renderer.setSize(window.innerWidth, window.innerHeight);
			particles.mat.uniforms.u_size.value = config.particleSize * renderer.getPixelRatio();
			readScroll();
		});
		window.addEventListener("pointermove", (e) => {
			pointer.tx = (e.clientX / window.innerWidth) * 2 - 1;
			pointer.ty = -((e.clientY / window.innerHeight) * 2 - 1);
		}, { passive: true });

		// --- control panel wiring ----------------------------------------
		const panel = document.getElementById("panel");
		document.getElementById("panelToggle").addEventListener("click", () => {
			panel.classList.toggle("collapsed");
		});

		function bindSlider(id, valId, onChange, fmt) {
			const slider = document.getElementById(id);
			const valEl = document.getElementById(valId);
			slider.addEventListener("input", () => {
				const v = parseFloat(slider.value);
				valEl.textContent = fmt(v);
				onChange(v);
			});
		}

		bindSlider("s-count", "v-count", (v) => {
			config.particleCount = Math.round(v);
			rebuildParticles();
		}, (v) => String(Math.round(v)));

		bindSlider("s-glow", "v-glow", (v) => {
			config.glowSpeed = v;
		}, (v) => v.toFixed(2) + "×");

		bindSlider("s-size", "v-size", (v) => {
			config.particleSize = v;
			particles.mat.uniforms.u_size.value = v * renderer.getPixelRatio();
		}, (v) => String(Math.round(v)));

		bindSlider("s-scale", "v-scale", (v) => {
			config.modelScale = v;
			applyModelScale();
		}, (v) => v.toFixed(1));

		bindSlider("s-rot", "v-rot", (v) => {
			config.rotationTurns = v;
		}, (v) => v.toFixed(1));

		readScroll();
		tick();
	})();
	</script>
</body>
</html>
