<!doctype html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Scroll Rotate · Particle Scene</title>
	<link rel="stylesheet" href="style.css" />
</head>
<body>
	<canvas id="webgl"></canvas>
	<div id="outro-veil"></div>

	<h1 class="headline">We build what the internet hasn't seen before.</h1>

	<div id="fps">— fps</div>
	<div class="notice" id="notice"></div>

	<div class="panel" id="panel">
		<button class="panel-toggle" id="panelToggle">Controls</button>
		<div class="panel-body">
			<div class="ctrl upload-ctrl">
				<label>Ground model</label>
				<input type="file" id="upload" accept=".glb,.gltf" />
				<div class="hint">Pick/drop a .glb/.gltf to replace the ground. The glass logo stays.</div>
			</div>
			<div class="ctrl">
				<label>Particles <span class="val" id="v-count">2000</span></label>
				<input type="range" id="s-count" min="300" max="9000" step="100" value="2000" />
			</div>
			<div class="ctrl">
				<label>Glow speed <span class="val" id="v-glow">0.30×</span></label>
				<input type="range" id="s-glow" min="0" max="4" step="0.05" value="0.3" />
			</div>
			<div class="ctrl">
				<label>Flake size <span class="val" id="v-size">15</span></label>
				<input type="range" id="s-size" min="8" max="90" step="1" value="15" />
			</div>
			<div class="ctrl">
				<label>Model size <span class="val" id="v-scale">1.5</span></label>
				<input type="range" id="s-scale" min="0" max="9" step="0.1" value="1.5" />
			</div>
			<div class="ctrl">
				<label>Model X <span class="val" id="v-mx">0.0</span></label>
				<input type="range" id="s-mx" min="-10" max="10" step="0.1" value="0" />
			</div>
			<div class="ctrl">
				<label>Model Y <span class="val" id="v-my">0.3</span></label>
				<input type="range" id="s-my" min="-10" max="10" step="0.1" value="0.3" />
			</div>
			<div class="ctrl">
				<label>Model Z <span class="val" id="v-mz">0.0</span></label>
				<input type="range" id="s-mz" min="-10" max="10" step="0.1" value="0" />
			</div>
			<div class="ctrl">
				<label>Camera dist <span class="val" id="v-cam">10.0</span></label>
				<input type="range" id="s-cam" min="3" max="16" step="0.1" value="10" />
			</div>
			<div class="ctrl">
				<label>Depth <span class="val" id="v-depth">1.00</span></label>
				<input type="range" id="s-depth" min="0.1" max="1" step="0.05" value="1" />
			</div>
			<div class="ctrl">
				<label>Transmission <span class="val" id="v-ltrans">1.00</span></label>
				<input type="range" id="s-ltrans" min="0" max="1" step="0.01" value="1" />
			</div>
			<div class="ctrl">
				<label>Roughness <span class="val" id="v-lrough">0.05</span></label>
				<input type="range" id="s-lrough" min="0" max="1" step="0.01" value="0.05" />
			</div>
			<div class="ctrl">
				<label>Metalness <span class="val" id="v-lmetal">0.00</span></label>
				<input type="range" id="s-lmetal" min="0" max="1" step="0.01" value="0" />
			</div>
			<div class="ctrl">
				<label>IOR <span class="val" id="v-lior">1.80</span></label>
				<input type="range" id="s-lior" min="1" max="2.5" step="0.05" value="1.8" />
			</div>
			<div class="ctrl">
				<label>Thickness <span class="val" id="v-lthick">0.70</span></label>
				<input type="range" id="s-lthick" min="0" max="3" step="0.05" value="0.7" />
			</div>
			<div class="ctrl">
				<label>Glass chroma <span class="val" id="v-lchroma">0.070</span></label>
				<input type="range" id="s-lchroma" min="0" max="0.2" step="0.005" value="0.07" />
			</div>
			<div class="ctrl">
				<label>Anisotropy <span class="val" id="v-laniso">0.00</span></label>
				<input type="range" id="s-laniso" min="0" max="1" step="0.05" value="0" />
			</div>
			<div class="ctrl">
				<label>Clearcoat <span class="val" id="v-lcc">1.00</span></label>
				<input type="range" id="s-lcc" min="0" max="1" step="0.05" value="1" />
			</div>
			<div class="ctrl">
				<label>Clearcoat rough <span class="val" id="v-lccr">0.00</span></label>
				<input type="range" id="s-lccr" min="0" max="1" step="0.01" value="0" />
			</div>
			<div class="ctrl">
				<label>Env intensity <span class="val" id="v-lenv">1.60</span></label>
				<input type="range" id="s-lenv" min="0" max="5" step="0.1" value="1.6" />
			</div>
			<div class="ctrl">
				<label>Attenuation dist <span class="val" id="v-latt">10.0</span></label>
				<input type="range" id="s-latt" min="0.1" max="10" step="0.1" value="10" />
			</div>
			<div class="ctrl">
				<label>Rotation / scroll <span class="val" id="v-rot">-2.0</span></label>
				<input type="range" id="s-rot" min="-12" max="12" step="0.5" value="-2" />
			</div>
			<div class="ctrl">
				<label>Ground X <span class="val" id="v-gx">0.0</span></label>
				<input type="range" id="s-gx" min="-15" max="15" step="0.1" value="0" />
			</div>
			<div class="ctrl">
				<label>Ground Y <span class="val" id="v-gy">6.0</span></label>
				<input type="range" id="s-gy" min="-15" max="15" step="0.1" value="6" />
			</div>
			<div class="ctrl">
				<label>Ground Z <span class="val" id="v-gz">-3.0</span></label>
				<input type="range" id="s-gz" min="-15" max="15" step="0.1" value="-3" />
			</div>
			<div class="ctrl">
				<label>Ground size <span class="val" id="v-gscale">1.20</span></label>
				<input type="range" id="s-gscale" min="0.2" max="3" step="0.05" value="1.2" />
			</div>
			<div class="ctrl">
				<label>Ground spin <span class="val" id="v-gturns">-2.0</span></label>
				<input type="range" id="s-gturns" min="-12" max="12" step="0.5" value="-2" />
			</div>
			<div class="ctrl">
				<label>Sky spin <span class="val" id="v-sky">-2.0</span></label>
				<input type="range" id="s-sky" min="-4" max="4" step="0.1" value="-2" />
			</div>
			<div class="ctrl">
				<label>Sky angle <span class="val" id="v-skyangle">70°</span></label>
				<input type="range" id="s-skyangle" min="0" max="360" step="1" value="70" />
			</div>
			<div class="ctrl">
				<label>Sky drift <span class="val" id="v-skydrift">0.00</span></label>
				<input type="range" id="s-skydrift" min="0" max="0.3" step="0.01" value="0" />
			</div>
			<div class="ctrl">
				<label>Haze <span class="val" id="v-haze">0.05</span></label>
				<input type="range" id="s-haze" min="0" max="1" step="0.05" value="0.05" />
			</div>
			<div class="ctrl">
				<label>Bloom <span class="val" id="v-bloom">0.15</span></label>
				<input type="range" id="s-bloom" min="0" max="3" step="0.05" value="0.15" />
			</div>
			<div class="ctrl">
				<label>Chromatic <span class="val" id="v-chroma">0.012</span></label>
				<input type="range" id="s-chroma" min="0" max="0.2" step="0.005" value="0.012" />
			</div>
			<div class="ctrl">
				<label>Grain <span class="val" id="v-grain">0.01</span></label>
				<input type="range" id="s-grain" min="0" max="0.4" step="0.01" value="0.01" />
			</div>
			<div class="ctrl">
				<label>Outro speed <span class="val" id="v-outro">0.10</span></label>
				<input type="range" id="s-outro" min="0.02" max="0.5" step="0.01" value="0.10" />
			</div>
			<div class="ctrl">
				<label>Outro start <span class="val" id="v-outrostart">525vh</span></label>
				<input type="range" id="s-outrostart" min="200" max="590" step="5" value="525" />
			</div>
			<div class="ctrl">
				<label>Track length <span class="val" id="v-track">600vh</span></label>
				<input type="range" id="s-track" min="200" max="2000" step="50" value="600" />
			</div>
			<div class="ctrl">
				<label>Outro dim <span class="val" id="v-outrodim">0.50</span></label>
				<input type="range" id="s-outrodim" min="0" max="1" step="0.05" value="0.50" />
			</div>
			<button class="copy-btn" id="copyBtn">Copy settings</button>
		</div>
	</div>

	<div class="scroll-track"></div>

	<script type="importmap">
	{
		"imports": {
			"three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
			"three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
		}
	}
	</script>
	<script type="module" src="main.js"></script>
</body>
</html>
