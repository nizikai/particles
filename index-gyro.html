<!doctype html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Neon Obelisk Particle Sea</title>
	<style>
		* {
			box-sizing: border-box;
			margin: 0;
			padding: 0;
		}

		html,
		body {
			width: 100%;
			height: 100%;
			overflow: hidden;
			background: #000000;
		}

		#webgl {
			position: fixed;
			left: 0;
			right: 0;
			top: 1.5dvh;
			bottom: 0;
			width: 100vw;
			height: 98.5dvh;
			display: block;
			touch-action: none;
		}

		.scene-copy {
			position: fixed;
			z-index: 10;
			top: clamp(32px, 7vh, 96px);
			left: clamp(24px, 5vw, 92px);
			max-width: min(620px, calc(100vw - 48px));
			color: #eafaff;
			pointer-events: none;
			text-shadow: 0 0 28px rgb(0 184 255 / 0.18);
		}

		.scene-kicker {
			display: block;
			color: #18c8ff;
			font: 700 12px/1.2 "Avenir Next", "Trebuchet MS", sans-serif;
			letter-spacing: 0.22em;
			text-transform: uppercase;
		}

		.scene-title {
			margin-top: 10px;
			max-width: 8.5em;
			font: 500 clamp(46px, 6.4vw, 118px) / 0.9 Georgia, "Times New Roman", serif;
			letter-spacing: 0;
		}

		.scene-subtitle {
			margin-top: 18px;
			max-width: 28em;
			color: rgb(207 238 255 / 0.68);
			font: 500 clamp(14px, 1.1vw, 18px) / 1.5 "Avenir Next", "Trebuchet MS", sans-serif;
			letter-spacing: 0.02em;
		}

		@media (orientation: portrait) and (max-width: 720px) {
			#webgl {
				top: 25dvh;
				bottom: 0;
				height: 75dvh;
			}

			.scene-copy {
				top: max(24px, env(safe-area-inset-top));
				left: 22px;
				right: 22px;
				max-width: none;
				padding-top: clamp(12px, 3vh, 28px);
			}

			.scene-kicker {
				font-size: 10px;
			}

			.scene-title {
				margin-top: 8px;
				font-size: clamp(36px, 12vw, 64px);
			}

			.scene-subtitle {
				margin-top: 12px;
				max-width: 20em;
				font-size: 13px;
				line-height: 1.42;
			}
		}

		.support {
			position: fixed;
			left: 12px;
			right: 12px;
			bottom: 12px;
			padding: 10px 12px;
			border: 1px solid #2b3d51;
			border-radius: 10px;
			background: rgb(8 12 18 / 0.88);
			color: #c9d7e7;
			font: 13px/1.4 "Segoe UI", sans-serif;
		}

		.support.hidden {
			display: none;
		}

		.perf {
			position: fixed;
			top: 12px;
			right: 12px;
			padding: 8px 10px;
			border: 1px solid #1e3246;
			border-radius: 8px;
			background: rgb(5 10 16 / 0.8);
			color: #9dc9ec;
			font: 11px/1.3 "Segoe UI", sans-serif;
			letter-spacing: 0.02em;
			white-space: nowrap;
			pointer-events: none;
		}

		.perf.hidden {
			display: none;
		}

		.tuner {
			position: fixed;
			left: 12px;
			top: 12px;
			max-width: min(92vw, 580px);
			padding: 10px 12px;
			border: 1px solid #1f3346;
			border-radius: 8px;
			background: rgb(5 10 16 / 0.84);
			color: #95bedf;
			font: 11px/1.4 "Segoe UI", sans-serif;
			letter-spacing: 0.02em;
			white-space: pre-line;
		}

			.tuner.hidden {
				display: none;
			}

			.style-tuner {
				position: fixed;
				right: 12px;
				top: 12px;
				width: 310px;
				max-height: calc(100dvh - 24px);
				overflow-y: auto;
				padding: 12px 14px;
				border: 1px solid #1f3346;
				border-radius: 10px;
				background: rgb(5 10 16 / 0.92);
				color: #cfe6ff;
				font: 11px/1.35 "SF Pro Text", "Segoe UI", sans-serif;
				letter-spacing: 0.02em;
				z-index: 50;
			}

			.style-tuner.collapsed .style-tuner-body { display: none; }

			.style-tuner-header {
				display: flex;
				justify-content: space-between;
				align-items: center;
				margin-bottom: 8px;
				font-weight: 600;
				color: #8cd8ff;
				letter-spacing: 0.1em;
				text-transform: uppercase;
				font-size: 10px;
			}

			.style-tuner-header button {
				background: transparent;
				color: #8cd8ff;
				border: 1px solid #2a4a66;
				border-radius: 4px;
				font: 10px/1 "SF Pro Text", "Segoe UI", sans-serif;
				padding: 3px 8px;
				cursor: pointer;
			}

			.style-tuner-header button:hover { background: #143049; }

			.style-section {
				margin-top: 10px;
				padding-top: 8px;
				border-top: 1px solid #142436;
			}

			.style-section:first-of-type {
				margin-top: 0;
				padding-top: 0;
				border-top: none;
			}

			.style-section-title {
				color: #5a9dc8;
				font-size: 9px;
				letter-spacing: 0.14em;
				text-transform: uppercase;
				margin-bottom: 4px;
			}

			.style-row {
				display: grid;
				grid-template-columns: 1fr auto;
				column-gap: 8px;
				row-gap: 2px;
				margin: 6px 0;
				align-items: center;
			}

			.style-row label { color: #9ec8e8; }

			.style-row .val {
				color: #ffffff;
				font-variant-numeric: tabular-nums;
				font-size: 10px;
			}

			.style-row input[type="range"] {
				grid-column: span 2;
				width: 100%;
				margin: 0;
				accent-color: #18c8ff;
			}

			.style-row input[type="color"] {
				justify-self: end;
				width: 42px;
				height: 22px;
				padding: 0;
				border: 1px solid #2a4a66;
				border-radius: 4px;
				background: transparent;
				cursor: pointer;
			}

			.style-tuner .copy-btn {
				display: block;
				width: 100%;
				margin-top: 12px;
				padding: 9px 10px;
				background: #18c8ff;
				color: #001624;
				border: none;
				border-radius: 6px;
				font: 600 11px/1 "SF Pro Text", "Segoe UI", sans-serif;
				letter-spacing: 0.05em;
				text-transform: uppercase;
				cursor: pointer;
			}

			.style-tuner .copy-btn:hover { background: #4ddcff; }
			.style-tuner .copy-btn.copied { background: #4dffae; }

			@media (orientation: portrait) and (max-width: 720px) {
				.style-tuner { width: calc(100vw - 24px); right: 12px; left: 12px; }
			}

			</style>
	</head>
	<body>
	<canvas id="webgl" aria-label="Golden particle ocean scene"></canvas>
	<header class="scene-copy" aria-label="Scene title">
		<span class="scene-kicker">Nizikai</span>
		<h1 class="scene-title">Neon Obelisk</h1>
		<p class="scene-subtitle">Particle Sea</p>
		</header>
		<div id="support" class="support hidden"></div>
		<div id="perf" class="perf"></div>
		<div id="tuner" class="tuner hidden"></div>
		<div id="styleTuner" class="style-tuner">
			<div class="style-tuner-header">
				<span>Style Tuner</span>
				<button id="styleTunerToggle" type="button">Hide</button>
			</div>
			<div class="style-tuner-body" id="styleTunerBody"></div>
		</div>
			<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/Pass.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/FXAAShader.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/utils/BufferGeometryUtils.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
	<script>
		(() => {
			const canvas = document.getElementById("webgl");
			const support = document.getElementById("support");
			const perf = document.getElementById("perf");
			const tuner = document.getElementById("tuner");
			const isTouch = window.matchMedia("(pointer: coarse)").matches;
			const ua = navigator.userAgent || "";
			const isIOS = /iPad|iPhone|iPod/.test(ua);
			const isAndroid = /Android/.test(ua);
			const shortSide = Math.min(window.screen.width, window.screen.height);
			const longSide = Math.max(window.screen.width, window.screen.height);
			const isIPhoneX = /iPhone/.test(ua) && shortSide === 375 && longSide === 812 && window.devicePixelRatio >= 2.8;
			const isLowSpecMobile = isTouch && (isIOS || isAndroid);
			const isMobileDevice = isTouch && (isIOS || isAndroid);
			const desktopCores = navigator.hardwareConcurrency || 8;
			
			// Enhanced device capability detection
			function detectDeviceCapability() {
				const memory = navigator.deviceMemory || 4; // GB, defaults to 4 if unavailable
				const cores = navigator.hardwareConcurrency || 4;
				const isMobile = isTouch;
				
				// Check for known low-end devices
				const isOldIOS = isIOS && /OS [89]_/.test(ua); // iOS 8-9
				const isOldAndroid = isAndroid && /Android [45]\./.test(ua); // Android 4-5
				
				// Scoring system: lower = weaker device
				let score = 0;
				if (memory >= 8) score += 3;
				else if (memory >= 4) score += 2;
				else if (memory >= 2) score += 1;
				
				if (cores >= 8) score += 3;
				else if (cores >= 4) score += 2;
				else if (cores >= 2) score += 1;
				
				if (!isMobile) score += 2;
				if (isOldIOS || isOldAndroid) score -= 2;
				
				// Classify device tier
				if (score >= 7) return 'high';
				if (score >= 4) return 'medium';
				return 'low';
			}
			
			const deviceTier = detectDeviceCapability();
			const DESKTOP_SCENE_TOP_RATIO = 0.015;
			const MOBILE_SCENE_TOP_RATIO = 0.25;

			function getViewportSize() {
				const visualViewport = window.visualViewport;
				return {
					width: Math.max(1, Math.round(visualViewport?.width || window.innerWidth)),
					height: Math.max(1, Math.round(visualViewport?.height || window.innerHeight))
				};
			}

			function isPortraitViewport() {
				const viewport = getViewportSize();
				return viewport.height > viewport.width;
			}

			function isMobilePortraitViewport() {
				const viewport = getViewportSize();
				return viewport.height > viewport.width && viewport.width <= 720;
			}

			function getRenderSize() {
				const viewport = getViewportSize();
				const topRatio = getSceneTopRatio();
				return {
					width: viewport.width,
					height: Math.max(1, Math.round(viewport.height * (1 - topRatio)))
				};
			}

			function getSceneTopRatio() {
				return isMobilePortraitViewport() ? MOBILE_SCENE_TOP_RATIO : DESKTOP_SCENE_TOP_RATIO;
			}

			function getDesiredPixelRatioCap() {
				if (!isTouch) return 1.9;
				if (isIPhoneX) return isPortraitViewport() ? 1.38 : 1.22;
				if (isLowSpecMobile) return isPortraitViewport() ? 1.72 : 1.42;
				return isPortraitViewport() ? 1.88 : 1.55;
			}

			function getMinimumPixelRatioCap() {
				if (!isTouch) return 1.18;
				if (isIPhoneX) return 1.16;
				if (isLowSpecMobile) return 1.28;
				return 1.36;
			}

				// Tier-based configuration
				function getTierConfig() {
					switch(deviceTier) {
						case 'low':
							return {
								pixelRatioCap: 1.0,
								gridX: 140,
								gridZ: 80,
								bloomScale: 0.5,
								bloomStrength: 1.4,
								bloomRadius: 0.24,
								bloomThreshold: 0.72,
								useMicroLayer: false,
								pointSizeScale: 1.5,
								shaftCount: 0,
								enableShafts: false,
								usePostprocessing: false,
								antialias: false
							};
						case 'medium':
							return {
								pixelRatioCap: isIPhoneX ? 1.6 : isLowSpecMobile ? 1.8 : 2.0,
								gridX: isIPhoneX ? 160 : isLowSpecMobile ? 220 : 280,
								gridZ: isIPhoneX ? 96 : isLowSpecMobile ? 130 : 160,
								bloomScale: 1.0,
								bloomStrength: isIPhoneX ? 1.4 : isLowSpecMobile ? 1.6 : 1.8,
								bloomRadius: isIPhoneX ? 0.4 : isLowSpecMobile ? 0.48 : 0.55,
								bloomThreshold: isIPhoneX ? 0.62 : isLowSpecMobile ? 0.52 : 0.48,
								useMicroLayer: false,
								pointSizeScale: isIPhoneX ? 0.9 : isLowSpecMobile ? 1.0 : 1.08,
								shaftCount: isIPhoneX ? 1 : 2,
								enableShafts: false,
								usePostprocessing: true, // Keep cinematic post FX on medium-tier mobile; bloom still gated separately
								antialias: true
							};
						case 'high':
						default:
							return {
								pixelRatioCap: isTouch ? 2.2 : 1.9,
								gridX: isTouch ? 320 : 450,
								gridZ: isTouch ? 180 : 252,
								bloomScale: isTouch ? 1.0 : 0.82,
								bloomStrength: isTouch ? 1.55 : 1.55,
								bloomRadius: isTouch ? 1.32 : 1.32,
								bloomThreshold: isTouch ? 0.44 : 0.44,
								useMicroLayer: !isTouch && desktopCores >= 8,
								pointSizeScale: isTouch ? 1.08 : 1.18,
								shaftCount: 3,
								enableShafts: false,
								usePostprocessing: true, // Keep cinematic post FX on high-tier mobile; bloom still gated separately
								antialias: true
							};
					}
				}
				
				const tierConfig = getTierConfig();
				const BASE_PIXEL_RATIO_CAP = tierConfig.pixelRatioCap;
				const OCEAN_GRID_X = tierConfig.gridX;
				const OCEAN_GRID_Z = tierConfig.gridZ;
				const BASE_BLOOM_SCALE = tierConfig.bloomScale;
				const BLOOM_STRENGTH = tierConfig.bloomStrength;
				const BLOOM_RADIUS = tierConfig.bloomRadius;
				const BLOOM_THRESHOLD = tierConfig.bloomThreshold;
				const USE_MICRO_LAYER = false;
				const POINT_SIZE_SCALE = tierConfig.pointSizeScale;
				const SHAFT_COUNT = tierConfig.shaftCount;
				const ENABLE_ATMOSPHERIC_SHAFTS = tierConfig.enableShafts;
				const ENABLE_BLOOM_PASS = !isTouch;
				const FORCE_SKIP_POSTPROCESSING = !tierConfig.usePostprocessing;
				const CURSOR_RADIUS = isTouch ? 0.48 : 0.46;
				const CURSOR_STRENGTH = isTouch ? 1.0 : 0.94;
				const CURSOR_SMOOTHING = isTouch ? 0.16 : 0.18;
				const CURSOR_RETURN = isTouch ? 0.018 : 0.025;
				const CURSOR_RELEASE_FALLOFF = isTouch ? 0.02 : 0.026;
				const CURSOR_RECENTER_WHEN_IDLE = isTouch ? 0.32 : 0.28;
				const CURSOR_VEL_DAMP = isTouch ? 0.88 : 0.9;
				const GYRO_TILT_RANGE = isIPhoneX ? 18 : 22; // Increased from 9/10.5 for more sensitivity
				const GYRO_SMOOTHING = 0.08; // Reduced from 0.12 for smoother motion
				const GYRO_INFLUENCE_MULTIPLIER = 1.8; // Amplify gyro effect
				const FXAA_STRENGTH = isTouch ? 1.0 : 1.24;
				const WOMP_VERTEX_WELD_TOLERANCE = 1e-4;
				const SHOW_PERF_OVERLAY = false;
			const VIEWPORT_PROFILES = {
				default: {
					fov: 35,
					cameraBase: [7.14, 1.56, 7.64],
					cameraTarget: [0.42, 0.36, -0.06],
					focusOffset: [0, 0.16, 0],
					logoScale: 1,
					logoOffset: [0, 0, 0],
					pan: {
						x: 0.934,
						y: 0.36,
						zx: 0.366,
						zy: 0.16
					}
				},
				mobilePortrait: {
					fov: 46,
					cameraBase: [8.35, 2.0, 9.1],
					cameraTarget: [0.12, 0.36, -0.12],
					focusOffset: [0, 0.08, 0],
					logoScale: 0.68,
					logoOffset: [-0.16, -0.04, 0.04],
					pan: {
						x: 0.324,
						y: 0.12,
						zx: 0.142,
						zy: 0.06
					}
				}
			};

			function getSceneProfile() {
				return isMobilePortraitViewport() ? VIEWPORT_PROFILES.mobilePortrait : VIEWPORT_PROFILES.default;
			}
			const REQUIRED_POSTPROCESSING_SYMBOLS = [
				"Pass",
				"ShaderPass",
				"EffectComposer",
				"RenderPass",
				"CopyShader",
				"FXAAShader",
				"BufferGeometryUtils"
			].concat(ENABLE_BLOOM_PASS ? [
				"LuminosityHighPassShader",
				"UnrealBloomPass"
			] : []);

			let renderer;
			let scene;
			let camera;
			let composer;
			let bloomPass;
			let cinematicPass;
			let fxaaPass;
			let raycaster;
			let useComposer = true;
				let canUsePostprocessing = true;
				let coreMaterial;
				let hazeMaterial;
				let microMaterial;
				let shaftGroup;
			let clock;
			let cameraBase;
			let cameraTarget;
			let obeliskA;
			let obeliskB;
			let obeliskC;
			let logoWrapper;
			let logoBaseScale = 1;
			let logoRotationTarget = 0;
			let pixelRatioCap = BASE_PIXEL_RATIO_CAP;
			let bloomScale = BASE_BLOOM_SCALE;
			let showPerfOverlay = SHOW_PERF_OVERLAY;
			const logoMeshes = [];
			const logoMaterials = [];
			const perfState = {
				lastFrameTime: performance.now(),
				sampleMs: 0,
				sampleFrames: 0,
				totalMs: 0,
				totalFrames: 0,
				fps: 0,
				qualityTier: "balanced",
				qualitySettled: false,
				particleCount: 0
			};
			const logoPose = {
				px: -0.060,
				py: 0.030,
				pz: -0.620,
				rx: -0.612,
				ry: 6.720,
				rz: 0.353
			};
			const pointerState = {
				x: 0.5,
				y: 0.5,
				targetX: 0.5,
				targetY: 0.5,
				ndcX: 0,
				ndcY: 0,
				vx: 0,
				vy: 0,
				smoothVx: 0,
				smoothVy: 0,
				speed: 0,
				swirl: 0,
				influence: 0,
				release: 0,
				pressing: false,
				lastTs: performance.now(),
				active: false,
				events: 0
			};
			const gyroState = {
				listening: false,
					enabled: false,
					permissionRequested: false,
					permissionDenied: false,
					permissionPromptArmed: false,
					hasReading: false,
				baseBeta: null,
				baseGamma: null,
				targetX: 0,
				targetY: 0,
				x: 0,
				y: 0,
				lastTs: 0,
				// Additional smoothing layers
				smoothX: 0,
				smoothY: 0,
				velocityX: 0,
				velocityY: 0
			};
			const logoInteraction = {
				hover: 0,
				targetHover: 0,
				localX: 0,
				localY: 0,
				targetLocalX: 0,
				targetLocalY: 0
			};
			let poseEditMode = false;

			const oceanVertexShader = `
				precision highp float;

				uniform float u_time;
				uniform float u_pointSize;
				uniform vec2 u_obeliskA;
				uniform vec2 u_obeliskB;
				uniform vec2 u_obeliskC;
				uniform float u_layer;
				uniform vec2 u_cursor;
				uniform vec2 u_cursorVelocity;
				uniform float u_cursorRadius;
				uniform float u_cursorStrength;
				uniform float u_breezeTime;
				uniform float u_pointerSpeed;
				uniform float u_pointerSwirl;
				uniform float u_cursorInfluence;
				uniform float u_maxSizeMul;
					attribute float aSeed;

					varying float vImpact;
					varying float vCrest;
					varying float vDepth;
					varying float vSeed;
					varying float vTwinkle;
					varying float vHover;
					varying float vCore;
					varying float vTendril;
					varying float vStream;
					varying float vSpray;

				vec3 mod289(vec3 x) {
					return x - floor(x * (1.0 / 289.0)) * 289.0;
				}

				vec4 mod289(vec4 x) {
					return x - floor(x * (1.0 / 289.0)) * 289.0;
				}

				vec4 permute(vec4 x) {
					return mod289(((x * 34.0) + 1.0) * x);
				}

				vec4 taylorInvSqrt(vec4 r) {
					return 1.79284291400159 - 0.85373472095314 * r;
				}

				float snoise(vec3 v) {
					const vec2 C = vec2(1.0 / 6.0, 1.0 / 3.0);
					const vec4 D = vec4(0.0, 0.5, 1.0, 2.0);

					vec3 i = floor(v + dot(v, C.yyy));
					vec3 x0 = v - i + dot(i, C.xxx);
					vec3 g = step(x0.yzx, x0.xyz);
					vec3 l = 1.0 - g;
					vec3 i1 = min(g.xyz, l.zxy);
					vec3 i2 = max(g.xyz, l.zxy);

						base = mix(base, pageBackground, backgroundMask);
						float distToFocus = distance(vUv, u_focus);
						float focusMask = 1.0 - smoothstep(0.16, 0.37, distToFocus);
						float foregroundMask = smoothstep(0.52, 0.95, 1.0 - vUv.y);
						float farMask = smoothstep(0.3, 0.92, distToFocus);
						float blurMask = clamp((foregroundMask * 0.54 + farMask * 0.3) * (1.0 - focusMask * 0.92), 0.0, 0.38);

						float blurRadius = mix(0.8, 3.2, blurMask) * u_blurStrength;
						vec3 blurred = sampleBloom(vUv, vec2(1.0, 0.0), blurRadius);
						blurred += sampleBloom(vUv, vec2(0.0, 1.0), blurRadius);
						blurred *= 0.5;
						vec3 color = mix(base, blurred, blurMask * 0.35);
						vec3 tightGlow = sampleGlow(vUv, normalize(vec2(0.72, 0.26)), 5.5 * u_glowSpread) * 0.10;
						tightGlow += sampleGlow(vUv, normalize(vec2(-0.26, 0.72)), 5.5 * u_glowSpread) * 0.08;
						tightGlow += sampleGlow(vUv, normalize(vec2(1.0, 0.0)), 9.0 * u_glowSpread) * 0.08;
						tightGlow += sampleGlow(vUv, normalize(vec2(0.0, 1.0)), 9.0 * u_glowSpread) * 0.08;
						vec3 streakGlow = sampleGlow(vUv, normalize(vec2(-0.42, -1.0)), 28.0 * u_glowSpread) * 0.16;
						streakGlow += sampleGlow(vUv, normalize(vec2(-0.42, -1.0)), 58.0 * u_glowSpread) * 0.07;
						color += tightGlow * u_tightGlowMix + streakGlow * u_glowTint * u_streakGlowMix;

						vec2 px = 1.0 / u_resolution;
						vec3 neighbor = (
							texture2D(tDiffuse, vUv + vec2(px.x, 0.0)).rgb +
							texture2D(tDiffuse, vUv - vec2(px.x, 0.0)).rgb +
							texture2D(tDiffuse, vUv + vec2(0.0, px.y)).rgb +
							texture2D(tDiffuse, vUv - vec2(0.0, px.y)).rgb
						) * 0.25;
						float sharpMask = clamp(0.42 + focusMask * 1.08 - blurMask * 0.7, 0.0, 1.0);
						color += (base - neighbor) * u_sharpness * sharpMask;

						float glowSeed = smoothstep(0.22, 0.92, max(max(color.r, color.g), color.b));
						color += u_glowTint * glowSeed * (0.06 + blurMask * 0.08);
						color *= u_exposure;
						// removed blue tint addition — keep dark areas pure black
						color = pow(max(color, 0.0), vec3(u_gamma));

						float luma = dot(color, vec3(0.2126, 0.7152, 0.0722));
						color = mix(vec3(luma), color, u_saturation);
						color *= 1.0 - smoothstep(0.64, 1.22, distance(vUv, vec2(0.5))) * 0.22;
						color = mix(color, pageBackground, backgroundMask * 0.92);

						gl_FragColor = vec4(color, 1.0);
					}
				`
			};

			function createShaftTexture(width, height) {
				const texCanvas = document.createElement("canvas");
				texCanvas.width = width;
				texCanvas.height = height;
				const ctx = texCanvas.getContext("2d");
				const grad = ctx.createLinearGradient(0, 0, width, 0);

				grad.addColorStop(0.0, "rgba(255,255,255,0)");
				grad.addColorStop(0.36, "rgba(255,255,255,0.75)");
				grad.addColorStop(0.5, "rgba(255,255,255,1)");
				grad.addColorStop(0.64, "rgba(255,255,255,0.75)");
				grad.addColorStop(1.0, "rgba(255,255,255,0)");

				ctx.fillStyle = "rgba(0,0,0,0)";
				ctx.fillRect(0, 0, width, height);
				ctx.fillStyle = grad;
				ctx.fillRect(0, 0, width, height);

				const texture = new THREE.CanvasTexture(texCanvas);
				texture.wrapS = THREE.ClampToEdgeWrapping;
				texture.wrapT = THREE.ClampToEdgeWrapping;
				return texture;
			}

			function setPerfOverlayVisibility() {
				if (!perf) return;
				perf.classList.toggle("hidden", !showPerfOverlay);
				if (showPerfOverlay) {
					updatePerfHud();
				}
			}

			function updatePerfHud(note) {
				if (!perf || !showPerfOverlay) return;
				const fpsText = perfState.fps > 0 ? perfState.fps.toFixed(0) : "--";
				const dprText = renderer ? renderer.getPixelRatio().toFixed(2) : "--";
				const particles = perfState.particleCount > 0 ? perfState.particleCount.toLocaleString() : "--";
				const bloomText = ENABLE_BLOOM_PASS ? bloomScale.toFixed(2) : "off";
				const suffix = note ? ` | ${note}` : "";
				perf.textContent = `FPS ${fpsText} | DPR ${dprText} | cap ${pixelRatioCap.toFixed(2)} | bloom ${bloomText} | pts ${particles} | ${perfState.qualityTier}${suffix}`;
			}

			function updateCinematicResolution() {
				if (!renderer || !cinematicPass || !cinematicPass.material?.uniforms?.u_resolution) return;
				const pixelRatio = renderer.getPixelRatio();
				const renderSize = getRenderSize();
				cinematicPass.material.uniforms.u_resolution.value.set(
					Math.max(1, Math.floor(renderSize.width * pixelRatio)),
					Math.max(1, Math.floor(renderSize.height * pixelRatio))
				);
				if (cinematicPass.material.uniforms.u_sceneTopRatio) {
					cinematicPass.material.uniforms.u_sceneTopRatio.value = getSceneTopRatio();
				}
			}

			function updateFxaaResolution() {
				if (!renderer || !fxaaPass || !fxaaPass.material?.uniforms?.resolution) return;
				const pixelRatio = renderer.getPixelRatio();
				const renderSize = getRenderSize();
				const invW = 1 / Math.max(1, Math.floor(renderSize.width * pixelRatio));
				const invH = 1 / Math.max(1, Math.floor(renderSize.height * pixelRatio));
				fxaaPass.material.uniforms.resolution.value.set(
					invW * FXAA_STRENGTH,
					invH * FXAA_STRENGTH
				);
			}

			function applyRenderQuality() {
				if (!renderer) return;
				const renderSize = getRenderSize();
				const desiredCap = getDesiredPixelRatioCap();
				if (perfState.qualityTier === "performance") {
					pixelRatioCap = Math.min(pixelRatioCap, desiredCap);
				} else {
					pixelRatioCap = desiredCap;
				}
				const renderPixelRatio = Math.min(window.devicePixelRatio, pixelRatioCap);
				renderer.setPixelRatio(renderPixelRatio);
				renderer.setSize(renderSize.width, renderSize.height, false);

				if (useComposer && composer) {
					if (typeof composer.setPixelRatio === "function") {
						composer.setPixelRatio(renderPixelRatio);
					}
					composer.setSize(renderSize.width, renderSize.height);
					if (bloomPass) {
						bloomPass.setSize(
							Math.max(1, Math.floor(renderSize.width * bloomScale)),
							Math.max(1, Math.floor(renderSize.height * bloomScale))
						);
					}
					updateCinematicResolution();
					updateFxaaResolution();
				}

				updatePerfHud();
			}

			function settleAdaptiveQuality() {
				if (perfState.qualitySettled || perfState.totalMs < 3400) {
					return;
				}

				const avgFps = (perfState.totalFrames * 1000) / Math.max(1, perfState.totalMs);
				let note = "stable";

				// More aggressive downscaling for struggling devices
				if (avgFps < 24) {
					pixelRatioCap = Math.max(getMinimumPixelRatioCap() * 0.8, pixelRatioCap - 0.18);
					bloomScale = Math.max(0.4, bloomScale - 0.12);
					perfState.qualityTier = "performance";
					note = "aggressive downscale";
					applyRenderQuality();
				} else if (avgFps < 36) {
					pixelRatioCap = Math.max(getMinimumPixelRatioCap(), pixelRatioCap - 0.12);
					bloomScale = Math.max(isTouch ? 0.68 : 0.74, bloomScale - 0.08);
					perfState.qualityTier = "performance";
					note = "auto downscale";
					applyRenderQuality();
				} else if (!isLowSpecMobile && deviceTier !== 'low' && avgFps > 56 && window.devicePixelRatio > pixelRatioCap + 0.08) {
					pixelRatioCap = Math.min(window.devicePixelRatio, pixelRatioCap + 0.2);
					bloomScale = Math.min(1.0, bloomScale + 0.08);
					perfState.qualityTier = "high";
					note = "auto upscale";
					applyRenderQuality();
				}

				perfState.qualitySettled = true;
				updatePerfHud(note);
				console.log(`Quality settled: ${note} | FPS: ${avgFps.toFixed(1)} | Device tier: ${deviceTier}`);
			}

			function updateObeliskAnchorsFromLogo() {
				if (!logoWrapper) return;
				const worldBounds = new THREE.Box3().setFromObject(logoWrapper);
				const profile = getSceneProfile();
				const focusCenter = new THREE.Vector3();
				worldBounds.getCenter(focusCenter);
				const midZ = (worldBounds.min.z + worldBounds.max.z) * 0.5;
				const width = worldBounds.max.x - worldBounds.min.x;
				const leftX = worldBounds.min.x + width * 0.29;
				const rightX = worldBounds.max.x - width * 0.29;
				const centerX = (worldBounds.min.x + worldBounds.max.x) * 0.5;
				cameraTarget.set(
					focusCenter.x + profile.focusOffset[0],
					focusCenter.y + profile.focusOffset[1],
					focusCenter.z + profile.focusOffset[2]
				);
				obeliskA.set(leftX, midZ + 0.06);
				obeliskB.set(rightX, midZ - 0.05);
				obeliskC.set(centerX, midZ + 0.01);
				syncObeliskUniforms();
			}

			function applyLogoPose() {
				if (!logoWrapper) return;
				const profile = getSceneProfile();
				logoWrapper.position.set(
					logoPose.px + profile.logoOffset[0],
					logoPose.py + profile.logoOffset[1],
					logoPose.pz + profile.logoOffset[2]
				);
				logoWrapper.rotation.set(logoPose.rx, logoPose.ry, logoPose.rz);
				logoWrapper.scale.setScalar(logoBaseScale * profile.logoScale);
				logoRotationTarget = logoPose.ry;
				updateObeliskAnchorsFromLogo();
			}

			function updateTunerHud() {
				if (!tuner) return;
				if (!poseEditMode) {
					tuner.classList.add("hidden");
					return;
				}
				tuner.classList.remove("hidden");
				tuner.textContent =
					"Pose edit mode (P to close)\n"
					+ "Move: J/L (x) I/K (y) U/O (z)\n"
					+ "Rotate: Q/A (rx) W/S (ry) E/D (rz)\n"
					+ "Hold Shift for larger steps\n"
					+ `pos=(${logoPose.px.toFixed(3)}, ${logoPose.py.toFixed(3)}, ${logoPose.pz.toFixed(3)})  `
					+ `rot=(${logoPose.rx.toFixed(3)}, ${logoPose.ry.toFixed(3)}, ${logoPose.rz.toFixed(3)})`;
			}

			function onPoseKeydown(event) {
				const key = event.key.toLowerCase();
				if (key === "p") {
					poseEditMode = !poseEditMode;
					updateTunerHud();
					return;
				}
				if (key === "f") {
					showPerfOverlay = !showPerfOverlay;
					setPerfOverlayVisibility();
					return;
				}

				if (!poseEditMode || !logoWrapper) return;

				const step = event.shiftKey ? 0.05 : 0.01;
				const rotStep = event.shiftKey ? 0.06 : 0.012;
				let changed = false;

				switch (key) {
					case "j":
						logoPose.px -= step;
						changed = true;
						break;
					case "l":
						logoPose.px += step;
						changed = true;
						break;
					case "i":
						logoPose.py += step;
						changed = true;
						break;
					case "k":
						logoPose.py -= step;
						changed = true;
						break;
					case "u":
						logoPose.pz -= step;
						changed = true;
						break;
					case "o":
						logoPose.pz += step;
						changed = true;
						break;
					case "q":
						logoPose.rx += rotStep;
						changed = true;
						break;
					case "a":
						logoPose.rx -= rotStep;
						changed = true;
						break;
					case "w":
						logoPose.ry += rotStep;
						changed = true;
						break;
					case "s":
						logoPose.ry -= rotStep;
						changed = true;
						break;
					case "e":
						logoPose.rz += rotStep;
						changed = true;
						break;
					case "d":
						logoPose.rz -= rotStep;
						changed = true;
						break;
					default:
						break;
				}

				if (changed) {
					event.preventDefault();
					applyLogoPose();
					updateTunerHud();
				}
			}

			function hasSecureMotionContext() {
				return window.isSecureContext || location.hostname === "localhost" || location.hostname === "127.0.0.1";
			}

			function canUseGyroCamera() {
				return isMobileDevice && hasSecureMotionContext() && "DeviceOrientationEvent" in window;
			}

			function requiresGyroPermission() {
				return canUseGyroCamera() && typeof window.DeviceOrientationEvent?.requestPermission === "function";
			}

				function resetGyroBaseline() {
					gyroState.baseBeta = null;
				gyroState.baseGamma = null;
				gyroState.targetX = 0;
				gyroState.targetY = 0;
				gyroState.x = 0;
				gyroState.y = 0;
				gyroState.smoothX = 0;
				gyroState.smoothY = 0;
				gyroState.velocityX = 0;
				gyroState.velocityY = 0;
			}

			function onDeviceOrientation(event) {
				const beta = Number(event.beta);
				const gamma = Number(event.gamma);
				if (!Number.isFinite(beta) || !Number.isFinite(gamma)) return;

				if (gyroState.baseBeta === null || gyroState.baseGamma === null) {
					gyroState.baseBeta = beta;
					gyroState.baseGamma = gamma;
				}

				gyroState.targetX = THREE.MathUtils.clamp((gamma - gyroState.baseGamma) / GYRO_TILT_RANGE, -1, 1);
				gyroState.targetY = THREE.MathUtils.clamp((gyroState.baseBeta - beta) / GYRO_TILT_RANGE, -1, 1);
				gyroState.enabled = true;
				gyroState.hasReading = true;
				gyroState.lastTs = performance.now();
			}

			function enableGyroCamera() {
				if (!canUseGyroCamera() || gyroState.listening) return false;
				resetGyroBaseline();
					window.addEventListener("deviceorientation", onDeviceOrientation, { passive: true });
					gyroState.listening = true;
					gyroState.permissionDenied = false;
					return true;
				}

				async function requestGyroCameraAccess() {
					if (!canUseGyroCamera() || gyroState.listening || gyroState.permissionDenied || gyroState.permissionRequested) {
						return gyroState.listening;
					}

				const orientationEvent = window.DeviceOrientationEvent;
				if (typeof orientationEvent?.requestPermission !== "function") {
					return enableGyroCamera();
				}

				if (gyroState.permissionRequested) {
					return gyroState.listening;
				}

				gyroState.permissionRequested = true;
				try {
					const permission = await orientationEvent.requestPermission();
					if (permission === "granted") {
						return enableGyroCamera();
					}
					gyroState.permissionDenied = true;
					} catch (error) {
						gyroState.permissionRequested = false;
						console.warn("Device orientation permission was not granted.", error);
						armGyroPermissionGesture();
					}
					return false;
				}

				function cleanupGyroPermissionGesture() {
					window.removeEventListener("touchend", onGyroPermissionGesture, true);
					window.removeEventListener("click", onGyroPermissionGesture, true);
					gyroState.permissionPromptArmed = false;
				}

				function onGyroPermissionGesture() {
					if (!gyroState.permissionPromptArmed) return;
					cleanupGyroPermissionGesture();
					void requestGyroCameraAccess();
				}

				function armGyroPermissionGesture() {
					if (!requiresGyroPermission() || gyroState.listening || gyroState.permissionDenied || gyroState.permissionPromptArmed) {
						return;
					}
					gyroState.permissionPromptArmed = true;
					window.addEventListener("touchend", onGyroPermissionGesture, { passive: true, capture: true });
					window.addEventListener("click", onGyroPermissionGesture, { capture: true });
				}

				function setupGyroCameraAccess() {
					if (!canUseGyroCamera()) return;
					if (requiresGyroPermission()) {
						armGyroPermissionGesture();
						return;
					}
					enableGyroCamera();
			}

			function updateGyroCameraInput() {
				if (!gyroState.enabled || !gyroState.hasReading) return;
				
				const isStale = performance.now() - gyroState.lastTs > 1200;
				const targetX = isStale ? 0 : gyroState.targetX * GYRO_INFLUENCE_MULTIPLIER;
				const targetY = isStale ? 0 : gyroState.targetY * GYRO_INFLUENCE_MULTIPLIER;
				
				// Primary smoothing layer
				gyroState.x += (targetX - gyroState.x) * GYRO_SMOOTHING;
				gyroState.y += (targetY - gyroState.y) * GYRO_SMOOTHING;
				
				// Secondary smoothing layer with velocity damping
				const velocityDamping = 0.85;
				gyroState.velocityX = (gyroState.x - gyroState.smoothX) * 0.15;
				gyroState.velocityY = (gyroState.y - gyroState.smoothY) * 0.15;
				gyroState.velocityX *= velocityDamping;
				gyroState.velocityY *= velocityDamping;
				
				gyroState.smoothX += gyroState.velocityX;
				gyroState.smoothY += gyroState.velocityY;
				
				// Clamp final values
				gyroState.smoothX = THREE.MathUtils.clamp(gyroState.smoothX, -1.5, 1.5);
				gyroState.smoothY = THREE.MathUtils.clamp(gyroState.smoothY, -1.5, 1.5);
			}

			function getCameraInput() {
				if (gyroState.enabled && gyroState.hasReading) {
					return {
						x: gyroState.smoothX, // Use smoothed values
						y: gyroState.smoothY
					};
				}

				return {
					x: (pointerState.x - 0.5) * 2,
					y: (pointerState.y - 0.5) * 2
				};
			}

			function setPointerTarget(clientX, clientY, pressing = false) {
				const rect = canvas.getBoundingClientRect();
				if (!rect.width || !rect.height) return;

				const nx = THREE.MathUtils.clamp((clientX - rect.left) / rect.width, 0, 1);
				const ny = THREE.MathUtils.clamp((clientY - rect.top) / rect.height, 0, 1);
				const cursorY = 1 - ny;
				const now = performance.now();
				const dt = Math.max(8, now - pointerState.lastTs);
				const frameScale = 16.666 / dt;
				const prevTargetX = pointerState.targetX;
				const prevTargetY = pointerState.targetY;

				pointerState.targetX = nx;
				pointerState.targetY = cursorY;
				pointerState.ndcX = nx * 2 - 1;
				pointerState.ndcY = cursorY * 2 - 1;
				pointerState.vx = THREE.MathUtils.clamp((nx - prevTargetX) * frameScale * 3.4, -2.1, 2.1);
				pointerState.vy = THREE.MathUtils.clamp((cursorY - prevTargetY) * frameScale * 3.4, -2.1, 2.1);
				pointerState.lastTs = now;
				pointerState.active = true;
				pointerState.pressing = pressing;
				pointerState.release = 1.0;
				pointerState.events += 1;
			}

			function onPointerDown(event) {

			}

			function onPointerRelease() {
				pointerState.active = false;
				pointerState.pressing = false;
				pointerState.release = Math.max(pointerState.release, 1.0);
				logoInteraction.targetHover = 0;
			}

			function updateCursorState() {
				if (pointerState.active) {
					pointerState.release = 1.0;
				} else {
					pointerState.release = Math.max(0.0, pointerState.release - CURSOR_RELEASE_FALLOFF);
					const recenterStrength = CURSOR_RETURN * (1.0 - pointerState.release) * CURSOR_RECENTER_WHEN_IDLE;
					pointerState.targetX += (0.5 - pointerState.targetX) * recenterStrength;
					pointerState.targetY += (0.5 - pointerState.targetY) * recenterStrength;
				}

				const prevX = pointerState.x;
				const prevY = pointerState.y;
				const prevSmoothVx = pointerState.smoothVx;
				const prevSmoothVy = pointerState.smoothVy;

				pointerState.x += (pointerState.targetX - pointerState.x) * CURSOR_SMOOTHING;
				pointerState.y += (pointerState.targetY - pointerState.y) * CURSOR_SMOOTHING;
				pointerState.smoothVx = pointerState.x - prevX;
				pointerState.smoothVy = pointerState.y - prevY;

				const speedInstant = Math.min(1.0, Math.hypot(pointerState.smoothVx, pointerState.smoothVy) * 22.0);
				pointerState.speed = THREE.MathUtils.lerp(pointerState.speed, speedInstant, 0.22);

				const cross = prevSmoothVx * pointerState.smoothVy - prevSmoothVy * pointerState.smoothVx;
				const swirlInstant = THREE.MathUtils.clamp(cross * 520.0, -1.0, 1.0);
				pointerState.swirl = THREE.MathUtils.lerp(pointerState.swirl, swirlInstant, 0.24);
				const activeInfluence = pointerState.active ? (pointerState.pressing ? 1.18 : 0.86) : 0.0;
				const releaseInfluence = pointerState.active ? 0.0 : pointerState.release * 0.68;
				const targetInfluence = Math.max(activeInfluence, releaseInfluence);
				pointerState.influence = THREE.MathUtils.lerp(
					pointerState.influence,
					targetInfluence,
					pointerState.active ? 0.2 : 0.06
				);

				pointerState.vx *= CURSOR_VEL_DAMP;
				pointerState.vy *= CURSOR_VEL_DAMP;

				if (!pointerState.active) {
					const releaseSpeedDamp = THREE.MathUtils.lerp(0.94, 0.982, pointerState.release);
					const releaseSwirlDamp = THREE.MathUtils.lerp(0.9, 0.974, pointerState.release);
					pointerState.speed *= releaseSpeedDamp;
					pointerState.swirl *= releaseSwirlDamp;
				}
			}

			function getLogoScreenBounds() {
				if (!logoWrapper || !camera) return null;

				const box = new THREE.Box3().setFromObject(logoWrapper);
				if (box.isEmpty()) return null;

				const min = box.min;
				const max = box.max;
				const corners = [
					new THREE.Vector3(min.x, min.y, min.z),
					new THREE.Vector3(min.x, min.y, max.z),
					new THREE.Vector3(min.x, max.y, min.z),
					new THREE.Vector3(min.x, max.y, max.z),
					new THREE.Vector3(max.x, min.y, min.z),
					new THREE.Vector3(max.x, min.y, max.z),
					new THREE.Vector3(max.x, max.y, min.z),
					new THREE.Vector3(max.x, max.y, max.z)
				];
				let minX = Infinity;
				let minY = Infinity;
				let maxX = -Infinity;
				let maxY = -Infinity;

				corners.forEach((corner) => {
					corner.project(camera);
					minX = Math.min(minX, corner.x);
					minY = Math.min(minY, corner.y);
					maxX = Math.max(maxX, corner.x);
					maxY = Math.max(maxY, corner.y);
				});

				return {
					minX,
					minY,
					maxX,
					maxY,
					centerX: (minX + maxX) * 0.5,
					centerY: (minY + maxY) * 0.5,
					halfX: Math.max(0.001, (maxX - minX) * 0.5),
					halfY: Math.max(0.001, (maxY - minY) * 0.5)
				};
			}

			function updateLogoHoverTarget() {
				if (!pointerState.active || poseEditMode || !raycaster || !camera || !logoMeshes.length) {
					logoInteraction.targetHover = 0;
					logoInteraction.targetLocalX = 0;
					logoInteraction.targetLocalY = 0;
					return;
				}

				const bounds = getLogoScreenBounds();
				const padding = 0.045 + pointerState.speed * 0.02;
				const isNearBounds = bounds
					&& pointerState.ndcX >= bounds.minX - padding
					&& pointerState.ndcX <= bounds.maxX + padding
					&& pointerState.ndcY >= bounds.minY - padding
					&& pointerState.ndcY <= bounds.maxY + padding;

				raycaster.setFromCamera({ x: pointerState.ndcX, y: pointerState.ndcY }, camera);
				const isOnMesh = raycaster.intersectObjects(logoMeshes, false).length > 0;
				const isHovering = isOnMesh || isNearBounds;

				logoInteraction.targetHover = isHovering ? 1 : 0;
				logoInteraction.targetLocalX = isHovering && bounds
					? THREE.MathUtils.clamp((pointerState.ndcX - bounds.centerX) / bounds.halfX, -1, 1)
					: 0;
				logoInteraction.targetLocalY = isHovering && bounds
					? THREE.MathUtils.clamp((pointerState.ndcY - bounds.centerY) / bounds.halfY, -1, 1)
					: 0;
			}

			function updateLogoInteraction(t) {
				if (!logoWrapper) return;
				const profile = getSceneProfile();

				logoInteraction.hover = 0;
				logoInteraction.targetHover = 0;
				logoWrapper.position.set(
					logoPose.px + profile.logoOffset[0],
					logoPose.py + profile.logoOffset[1],
					logoPose.pz + profile.logoOffset[2]
				);
				logoWrapper.rotation.set(logoPose.rx, logoPose.ry, logoPose.rz);
				logoWrapper.scale.setScalar(logoBaseScale * profile.logoScale);

				// Material properties are set in addLogoModel and now controlled live via the Style Tuner.
			}

			function detectWebGLIssue() {
				if (!window.WebGLRenderingContext) {
					return "WebGL is not available in this browser.";
				}

				const probe = document.createElement("canvas");
				const context =
					probe.getContext("webgl", { antialias: false, alpha: false })
					|| probe.getContext("experimental-webgl");

				if (!context) {
					return "WebGL context creation failed.";
				}

				const loseContext = context.getExtension("WEBGL_lose_context");
				if (loseContext) {
					loseContext.loseContext();
				}

				return null;
			}

			function getMissingPostprocessingSymbols() {
				return REQUIRED_POSTPROCESSING_SYMBOLS.filter((symbol) => typeof THREE[symbol] === "undefined");
			}

			function runStartupChecks() {
				if (!window.THREE || typeof THREE.WebGLRenderer === "undefined") {
					return {
						ok: false,
						fatalMessage: "Three.js core script is missing. Check that three.min.js is reachable."
					};
				}

				const webglIssue = detectWebGLIssue();
				if (webglIssue) {
					return {
						ok: false,
						fatalMessage: `${webglIssue} Open this page in a system browser with hardware acceleration enabled.`
					};
				}

				const missingSymbols = getMissingPostprocessingSymbols();
				canUsePostprocessing = missingSymbols.length === 0;

				if (!canUsePostprocessing) {
					showSupportMessage(
						`Bloom disabled: missing Three.js postprocessing symbols (${missingSymbols.join(", ")}).`
					);
					console.warn("Post-processing scripts missing. Falling back to direct render.", missingSymbols);
				}

				return { ok: true };
			}

			function initStaticVectors() {
				const profile = getSceneProfile();
				clock = new THREE.Clock();
					raycaster = new THREE.Raycaster();
					cameraBase = new THREE.Vector3(...profile.cameraBase);
					cameraTarget = new THREE.Vector3(...profile.cameraTarget);
				obeliskA = new THREE.Vector2(-0.56, 0.12);
				obeliskB = new THREE.Vector2(0.38, -0.08);
				obeliskC = new THREE.Vector2(-0.09, 0.01);
			}

			function initRenderer() {
				renderer = new THREE.WebGLRenderer({
					canvas,
					antialias: tierConfig.antialias,
					alpha: false,
					precision: deviceTier === 'low' ? 'mediump' : 'highp',
					powerPreference: deviceTier === 'low' ? 'default' : 'high-performance',
					stencil: false, // Disable stencil buffer if not needed
					depth: true
				});
				renderer.outputEncoding = THREE.sRGBEncoding;
				renderer.toneMapping = THREE.ACESFilmicToneMapping;
				renderer.toneMappingExposure = 1.97;
				renderer.setClearColor(0x000000, 1);
				applyRenderQuality();
			}

			function initScene() {
				const renderSize = getRenderSize();
				const profile = getSceneProfile();
				scene = new THREE.Scene();
				scene.background = new THREE.Color(0x000000);
				scene.fog = new THREE.FogExp2(0x000000, 0.013);

				camera = new THREE.PerspectiveCamera(profile.fov, renderSize.width / renderSize.height, 0.1, 80);
				camera.position.copy(cameraBase);
				camera.lookAt(cameraTarget);
			}

			function syncResponsiveSceneProfile() {
				if (!camera || !cameraBase || !cameraTarget) return;
				const renderSize = getRenderSize();
				const profile = getSceneProfile();
				camera.aspect = renderSize.width / renderSize.height;
				camera.fov = profile.fov;
				cameraBase.set(...profile.cameraBase);
				cameraTarget.set(...profile.cameraTarget);
				camera.updateProjectionMatrix();
				applyLogoPose();
			}

			function addLighting() {
				// Mobile gets brighter lighting, desktop stays original
				const keyIntensity = isMobileDevice ? 1.2 : 0.76;
				const rimIntensity = isMobileDevice ? 3.2 : 2.32;
				const rearIntensity = isMobileDevice ? 1.5 : 0.96;
				const fillIntensity = isMobileDevice ? 0.6 : 0.3;
				const skyIntensity = isMobileDevice ? 0.28 : 0.17;
				const ambientIntensity = isMobileDevice ? 0.12 : 0.052;
				
				const downKey = new THREE.DirectionalLight(0xffe8b8, keyIntensity);
				downKey.position.set(-0.8, 9.5, -1.2);
				downKey.target.position.set(0, 0, 0);
				scene.add(downKey);
				scene.add(downKey.target);

				const rim = new THREE.DirectionalLight(0xff9a3a, rimIntensity);
				rim.position.set(-5.0, 2.8, -3.9);
				scene.add(rim);

				const rearWarm = new THREE.DirectionalLight(0xff5a14, rearIntensity);
				rearWarm.position.set(4.4, 1.9, -4.8);
				scene.add(rearWarm);

				const frontFill = new THREE.DirectionalLight(0x6b3500, fillIntensity);
				frontFill.position.set(3.3, 1.35, 2.8);
				scene.add(frontFill);

				const sky = new THREE.HemisphereLight(0xff9a3a, 0x140600, skyIntensity);
				scene.add(sky);

				const warmAmbient = new THREE.AmbientLight(0x2a1200, ambientIntensity);
				scene.add(warmAmbient);

			function createFallbackObelisks() {
				const leftGeom = new THREE.BoxGeometry(0.84, 2.75, 0.58);
				const rightGeom = new THREE.BoxGeometry(0.98, 3.9, 0.68);
				const mat = new THREE.MeshStandardMaterial({
					color: 0x0f0900,
					roughness: 0.41,
					metalness: 1.0,
					emissive: 0x0a0500,
					emissiveIntensity: 0.10
				});

				const left = new THREE.Mesh(leftGeom, mat);
				left.position.set(-0.56, 0.73, 0.12);
				left.rotation.z = -Math.PI * 0.25;
				left.rotation.y = Math.PI * 0.08;

				const right = new THREE.Mesh(rightGeom, mat);
				right.position.set(0.38, 1.06, -0.08);
				right.rotation.z = -Math.PI * 0.25;
				right.rotation.y = -Math.PI * 0.08;

				scene.add(left);
				scene.add(right);
			}

				function syncObeliskUniforms() {
					if (coreMaterial && coreMaterial.uniforms) {
						coreMaterial.uniforms.u_obeliskA.value.copy(obeliskA);
						coreMaterial.uniforms.u_obeliskB.value.copy(obeliskB);
						coreMaterial.uniforms.u_obeliskC.value.copy(obeliskC);
					}
					if (hazeMaterial && hazeMaterial.uniforms) {
						hazeMaterial.uniforms.u_obeliskA.value.copy(obeliskA);
						hazeMaterial.uniforms.u_obeliskB.value.copy(obeliskB);
						hazeMaterial.uniforms.u_obeliskC.value.copy(obeliskC);
					}
					if (microMaterial && microMaterial.uniforms) {
						microMaterial.uniforms.u_obeliskA.value.copy(obeliskA);
						microMaterial.uniforms.u_obeliskB.value.copy(obeliskB);
						microMaterial.uniforms.u_obeliskC.value.copy(obeliskC);
					}
				}

			async function addLogoModel() {
				if (!THREE.GLTFLoader) {
					console.warn("GLTFLoader not available. Falling back to primitive obelisks.");
					createFallbackObelisks();
					return;
				}

				const loader = new THREE.GLTFLoader();
				await new Promise((resolve) => {
					loader.load(
						"./scene.glb",
						(gltf) => {
							const model = gltf.scene || gltf.scenes?.[0];
							if (!model) {
								createFallbackObelisks();
								resolve();
								return;
							}

							const bounds = new THREE.Box3().setFromObject(model);
							const center = new THREE.Vector3();
							const size = new THREE.Vector3();
							bounds.getCenter(center);
							bounds.getSize(size);

							model.traverse((child) => {
								if (!child.isMesh) return;
								child.castShadow = false;
								child.receiveShadow = false;
								child.frustumCulled = true;
									if (child.geometry) {
										// Womp exports can carry split vertices; welding then recomputing normals softens jagged silhouettes.
										let geometry = child.geometry;
										if (THREE.BufferGeometryUtils && THREE.BufferGeometryUtils.mergeVertices) {
											try {
												geometry = THREE.BufferGeometryUtils.mergeVertices(geometry, WOMP_VERTEX_WELD_TOLERANCE);
											} catch (error) {
												console.warn("Geometry welding skipped for mesh.", error);
											}
										}
										geometry.computeVertexNormals();
										geometry.normalizeNormals();
										child.geometry = geometry;
									}
									child.material = new THREE.MeshPhysicalMaterial({
										color: 0x0f0900,
										roughness: 0.41,
										metalness: 1.0,
										clearcoat: 0.0,
										clearcoatRoughness: 0.28,
										reflectivity: 0.85,
										emissive: 0x0a0500,
										emissiveIntensity: 0.10
									});
									logoMeshes.push(child);
									logoMaterials.push(child.material);
								});

							model.position.sub(center);

							logoWrapper = new THREE.Group();
							logoWrapper.add(model);

								const targetHeight = 3.34;
								logoBaseScale = targetHeight / Math.max(size.y, 0.001);
								logoWrapper.scale.setScalar(logoBaseScale);
								applyLogoPose();
							scene.add(logoWrapper);
								updateObeliskAnchorsFromLogo();

							resolve();
						},
						undefined,
						(error) => {
							console.warn("Model load failed, fallback obelisks enabled.", error);
							showSupportMessage(
								"Model could not be loaded via file://. Open this scene from a local server to use scene.glb."
							);
							createFallbackObelisks();
							resolve();
						}
					);
				});
			}

			function createOceanGridGeometry(width, depth, segX, segZ, jitter) {
				const geometry = new THREE.PlaneBufferGeometry(width, depth, segX, segZ);
				geometry.rotateX(-Math.PI * 0.5);

				const positions = geometry.attributes.position.array;
				const count = geometry.attributes.position.count;
				const seeds = new Float32Array(count);
				for (let i = 0; i < count; i += 1) {
					const i3 = i * 3;
					positions[i3] += (Math.random() - 0.5) * jitter;
					positions[i3 + 2] += (Math.random() - 0.5) * jitter;
					seeds[i] = Math.random();
				}
				geometry.attributes.position.needsUpdate = true;
				geometry.setAttribute("aSeed", new THREE.BufferAttribute(seeds, 1));
				return geometry;
			}

				function addParticleOcean() {
					const coreGeometry = createOceanGridGeometry(23.2, 14.6, OCEAN_GRID_X, OCEAN_GRID_Z, 0.028);
					const hazeGeometry = coreGeometry.clone();
					const microSegX = Math.max(32, Math.floor(OCEAN_GRID_X * 0.62));
					const microSegZ = Math.max(24, Math.floor(OCEAN_GRID_Z * 0.56));
					const microGeometry = USE_MICRO_LAYER
						? createOceanGridGeometry(23.2, 14.6, microSegX, microSegZ, 0.034)
						: null;

				coreMaterial = createOceanMaterial({
					pointSize: (isTouch ? 0.75 : 0.68) * POINT_SIZE_SCALE,
					layer: 0,
					alphaScale: 2.77,
					cursorRadius: CURSOR_RADIUS,
					cursorStrength: CURSOR_STRENGTH,
					colorDeep: "#331b00",
					colorBright: "#cc8100",
					glowColor: "#ff7b00"
				});

					hazeMaterial = createOceanMaterial({
						pointSize: (isTouch ? 0.86 : 0.78) * POINT_SIZE_SCALE,
						layer: 1,
						alphaScale: 1.3,
						cursorRadius: CURSOR_RADIUS * 0.9,
						cursorStrength: CURSOR_STRENGTH * 0.82,
						colorDeep: "#1f1000",
						colorBright: "#ff9a3a",
						glowColor: "#ff7b00"
					});

					if (USE_MICRO_LAYER) {
						microMaterial = createOceanMaterial({
							pointSize: (isTouch ? 0.32 : 0.28) * POINT_SIZE_SCALE,
							layer: 2,
							alphaScale: 0.12,
							cursorRadius: CURSOR_RADIUS * 0.76,
							cursorStrength: CURSOR_STRENGTH * 0.58,
							colorDeep: "#002033",
							colorBright: "#7ef4ff",
							glowColor: "#30e0ff"
						});
					}

				const coreOcean = new THREE.Points(coreGeometry, coreMaterial);
				coreOcean.position.set(0, -0.62, 0);
				coreOcean.renderOrder = 2;

					const hazeOcean = new THREE.Points(hazeGeometry, hazeMaterial);
					hazeOcean.position.copy(coreOcean.position);
					hazeOcean.renderOrder = 1;

					scene.add(hazeOcean);
					scene.add(coreOcean);

					if (USE_MICRO_LAYER && microMaterial && microGeometry) {
						const microOcean = new THREE.Points(microGeometry, microMaterial);
						microOcean.position.copy(coreOcean.position);
						microOcean.renderOrder = 3;
						scene.add(microOcean);
					}

					perfState.particleCount = coreGeometry.attributes.position.count
						+ hazeGeometry.attributes.position.count
						+ (microGeometry ? microGeometry.attributes.position.count : 0);
					updatePerfHud();
				}

			function addAtmosphericShafts() {
				if (!ENABLE_ATMOSPHERIC_SHAFTS) return;

				const shaftTex = createShaftTexture(64, 1024);
				shaftGroup = new THREE.Group();

				function createShaft(config) {
					const material = new THREE.MeshBasicMaterial({
						map: shaftTex,
						color: 0xb25a17,
						transparent: true,
						opacity: config.opacity,
						blending: THREE.AdditiveBlending,
						depthWrite: false,
						depthTest: true,
						side: THREE.DoubleSide
					});

					const shaft = new THREE.Mesh(new THREE.PlaneGeometry(config.w, config.h), material);
					shaft.position.set(config.x, config.y, config.z);
					shaft.rotation.y = config.ry;
					shaft.rotation.z = config.rz;
					shaft.userData.baseOpacity = config.opacity;
					shaft.userData.baseRz = config.rz;
					shaftGroup.add(shaft);
				}

					const shafts = [
						{ x: -1.9, y: 2.0, z: -2.6, w: 2.2, h: 5.8, ry: 0.28, rz: -0.19, opacity: 0.03 },
						{ x: -1.25, y: 1.9, z: -2.3, w: 1.8, h: 5.2, ry: 0.18, rz: -0.16, opacity: 0.022 },
						{ x: -0.6, y: 1.7, z: -2.0, w: 1.5, h: 4.6, ry: 0.12, rz: -0.12, opacity: 0.016 }
					];

				shafts.slice(0, SHAFT_COUNT).forEach((config) => createShaft(config));

				scene.add(shaftGroup);
			}

			function initComposer() {
				// Skip all postprocessing only on tiers that explicitly force it
				if (FORCE_SKIP_POSTPROCESSING) {
					useComposer = false;
					composer = null;
					bloomPass = null;
					cinematicPass = null;
					fxaaPass = null;
					console.log('All postprocessing disabled for low-tier devices');
					return;
				}
				
				if (!canUsePostprocessing) {
					useComposer = false;
					composer = null;
					bloomPass = null;
					cinematicPass = null;
					fxaaPass = null;
					return;
				}

				try {
					const renderSize = getRenderSize();
					let composerTarget = null;
					
					// Use MSAA on all mobile devices to reduce bloom artifacts
					if (deviceTier !== 'low' && renderer.capabilities?.isWebGL2 && THREE.WebGLMultisampleRenderTarget) {
						composerTarget = new THREE.WebGLMultisampleRenderTarget(
							renderSize.width,
							renderSize.height,
							{
								format: THREE.RGBAFormat,
								type: THREE.UnsignedByteType
							}
						);
						composerTarget.texture.encoding = THREE.sRGBEncoding;
						// Higher MSAA samples for mobile to reduce blocky bloom
						composerTarget.samples = isMobileDevice ? 8 : (deviceTier === 'high' ? 4 : 2);
					}

					composer = composerTarget
						? new THREE.EffectComposer(renderer, composerTarget)
						: new THREE.EffectComposer(renderer);
					if (typeof composer.setPixelRatio === "function") {
						composer.setPixelRatio(renderer.getPixelRatio());
					}
					composer.addPass(new THREE.RenderPass(scene, camera));

					if (ENABLE_BLOOM_PASS) {
						bloomPass = new THREE.UnrealBloomPass(
							new THREE.Vector2(renderSize.width, renderSize.height),
							BLOOM_STRENGTH,
							BLOOM_RADIUS,
							BLOOM_THRESHOLD
						);
						composer.addPass(bloomPass);
					}

					cinematicPass = new THREE.ShaderPass(cinematicGradeShader);
					composer.addPass(cinematicPass);
					updateCinematicResolution();

					// Skip FXAA on low-tier devices (already skipped via FORCE_SKIP_POSTPROCESSING)
					fxaaPass = new THREE.ShaderPass(THREE.FXAAShader);
					composer.addPass(fxaaPass);
					updateFxaaResolution();

					useComposer = true;
					applyRenderQuality();
				} catch (error) {
					useComposer = false;
					composer = null;
					bloomPass = null;
					cinematicPass = null;
					fxaaPass = null;
					console.warn("Post-processing disabled.", error);
				}
			}

			function resize() {
				syncResponsiveSceneProfile();
				applyRenderQuality();
			}

			function animate() {
				requestAnimationFrame(animate);

				const now = performance.now();
				const dt = now - perfState.lastFrameTime;
				perfState.lastFrameTime = now;
				perfState.sampleMs += dt;
				perfState.sampleFrames += 1;
				perfState.totalMs += dt;
				perfState.totalFrames += 1;

				if (perfState.sampleMs >= 500) {
					perfState.fps = (perfState.sampleFrames * 1000) / Math.max(1, perfState.sampleMs);
					perfState.sampleMs = 0;
					perfState.sampleFrames = 0;
					updatePerfHud();
				}

				settleAdaptiveQuality();
				updateCursorState();
				updateGyroCameraInput();
				const cursorVelX = THREE.MathUtils.clamp(pointerState.smoothVx * 26.0 + pointerState.vx * 0.35, -2.4, 2.4);
				const cursorVelY = THREE.MathUtils.clamp(pointerState.smoothVy * 26.0 + pointerState.vy * 0.35, -2.4, 2.4);

					const t = clock.getElapsedTime();
					coreMaterial.uniforms.u_time.value = t;
					coreMaterial.uniforms.u_cursor.value.set(pointerState.x, pointerState.y);
					coreMaterial.uniforms.u_cursorVelocity.value.set(cursorVelX, cursorVelY);
					coreMaterial.uniforms.u_breezeTime.value = t * 0.65;
					coreMaterial.uniforms.u_pointerSpeed.value = pointerState.speed;
					coreMaterial.uniforms.u_pointerSwirl.value = pointerState.swirl;
					coreMaterial.uniforms.u_cursorInfluence.value = pointerState.influence;
					hazeMaterial.uniforms.u_time.value = t;
					hazeMaterial.uniforms.u_cursor.value.set(pointerState.x, pointerState.y);
					hazeMaterial.uniforms.u_cursorVelocity.value.set(cursorVelX, cursorVelY);
					hazeMaterial.uniforms.u_breezeTime.value = t * 0.65;
					hazeMaterial.uniforms.u_pointerSpeed.value = pointerState.speed;
					hazeMaterial.uniforms.u_pointerSwirl.value = pointerState.swirl;
					hazeMaterial.uniforms.u_cursorInfluence.value = pointerState.influence;
					if (microMaterial) {
						microMaterial.uniforms.u_time.value = t;
						microMaterial.uniforms.u_cursor.value.set(pointerState.x, pointerState.y);
						microMaterial.uniforms.u_cursorVelocity.value.set(cursorVelX, cursorVelY);
						microMaterial.uniforms.u_breezeTime.value = t * 0.65;
						microMaterial.uniforms.u_pointerSpeed.value = pointerState.speed;
						microMaterial.uniforms.u_pointerSwirl.value = pointerState.swirl;
						microMaterial.uniforms.u_cursorInfluence.value = pointerState.influence;
					}

				const cameraInput = getCameraInput();
				const cursorPanX = cameraInput.x;
				const cursorPanY = cameraInput.y;
				const cameraBreathX = Math.sin(t * 0.05) * 0.07;
				const cameraBreathY = Math.cos(t * 0.045) * 0.04;
				const cameraBreathZ = Math.cos(t * 0.055) * 0.06;
				const panProfile = getSceneProfile().pan;

				camera.position.set(
					cameraBase.x + cameraBreathX + cursorPanX * panProfile.x,
					cameraBase.y + cameraBreathY + cursorPanY * panProfile.y,
					cameraBase.z + cameraBreathZ - cursorPanX * panProfile.zx - cursorPanY * panProfile.zy
				);
				camera.lookAt(cameraTarget);

				if (logoWrapper) {
					updateLogoInteraction(t);
				}

				if (shaftGroup) {
					shaftGroup.children.forEach((shaft, index) => {
						shaft.material.opacity = shaft.userData.baseOpacity * (0.78 + 0.22 * Math.sin(t * 0.36 + index * 1.6));
						shaft.rotation.z = shaft.userData.baseRz + Math.sin(t * 0.14 + index) * 0.025;
					});
				}

				if (useComposer && composer) {
					composer.render();
				} else {
					renderer.render(scene, camera);
				}
			}

			const styleState = {
				// Exposure
				toneMappingExposure: 1.97,
				cinematicExposure: 1.15,
				gamma: 0.86,
				// Particles
				coreAlphaScale: 2.77,
				hazeAlphaScale: 1.3,
				maxSizeMul: 1.98,
				auraStrength: 2.02,
				fogDensity: 0.013,
				// Cinematic glow (post-process bleed)
				tightGlowMix: 0.0,
				streakGlowMix: 1.43,
				glowSpread: 0.2,
				glowThreshold: 0.0,
				// Unreal bloom
				bloomStrength: 1.55,
				bloomRadius: 1.32,
				bloomThreshold: 0.44,
				// Colors
				colorBright: "#cc8100",
				glowColor: "#ff7b00",
				colorDeep: "#331b00",
				glowTint: "#ff7300",
				// Obelisk material
				obeliskColor: "#0f0900",
				obeliskEmissive: "#0a0500",
				obeliskEmissiveIntensity: 0.10,
				obeliskMetalness: 1.0,
				obeliskRoughness: 0.41,
				obeliskClearcoat: 0.0
			};

			function setupStyleTuner() {
				const panel = document.getElementById("styleTuner");
				const body = document.getElementById("styleTunerBody");
				const toggle = document.getElementById("styleTunerToggle");
				if (!panel || !body || !toggle) return;

				const sections = [
					{
						title: "Exposure & Tone",
						sliders: [
							{ key: "toneMappingExposure", label: "Tone Map Expose",     min: 0.4, max: 3.0, step: 0.01 },
							{ key: "cinematicExposure",   label: "Cinematic Expose",   min: 0.4, max: 2.5, step: 0.01 },
							{ key: "gamma",               label: "Gamma (lower=brighter)", min: 0.5, max: 1.4, step: 0.01 }
						]
					},
					{
						title: "Particles",
						sliders: [
							{ key: "coreAlphaScale", label: "Core Alpha",        min: 0.2, max: 5.0,  step: 0.01 },
							{ key: "hazeAlphaScale", label: "Haze Alpha",        min: 0.0, max: 3.0,  step: 0.01 },
							{ key: "maxSizeMul",     label: "Particle Size Mul", min: 0.4, max: 3.0,  step: 0.01 },
							{ key: "auraStrength",   label: "Per-Particle Aura", min: 0.0, max: 4.0,  step: 0.01 },
							{ key: "fogDensity",     label: "Fog Density",       min: 0.0, max: 0.05, step: 0.001 }
						]
					},
					{
						title: "Cinematic Glow",
						sliders: [
							{ key: "tightGlowMix",  label: "Tight Halo",       min: 0.0, max: 4.0, step: 0.01 },
							{ key: "streakGlowMix", label: "Streak / Shafts",  min: 0.0, max: 4.0, step: 0.01 },
							{ key: "glowSpread",    label: "Glow Spread",      min: 0.2, max: 4.0, step: 0.01 },
							{ key: "glowThreshold", label: "Glow Threshold",   min: 0.0, max: 0.5, step: 0.01 }
						]
					},
					{
						title: "Bloom (UnrealBloomPass)",
						sliders: [
							{ key: "bloomStrength",  label: "Bloom Strength",  min: 0.0, max: 3.0, step: 0.01 },
							{ key: "bloomRadius",    label: "Bloom Radius",    min: 0.0, max: 1.5, step: 0.01 },
							{ key: "bloomThreshold", label: "Bloom Threshold", min: 0.0, max: 1.0, step: 0.01 }
						]
					},
					{
						title: "Colors",
						colors: [
							{ key: "colorBright", label: "Bright Color" },
							{ key: "glowColor",   label: "Glow Color (in-particle)" },
							{ key: "colorDeep",   label: "Deep Color" },
							{ key: "glowTint",    label: "Streak Tint (post)" }
						]
					},
					{
						title: "Obelisk Material",
						sliders: [
							{ key: "obeliskEmissiveIntensity", label: "Emissive Intensity", min: 0.0, max: 2.0, step: 0.01 },
							{ key: "obeliskMetalness",         label: "Metalness",          min: 0.0, max: 1.0, step: 0.01 },
							{ key: "obeliskRoughness",         label: "Roughness",          min: 0.0, max: 1.0, step: 0.01 },
							{ key: "obeliskClearcoat",         label: "Clearcoat",          min: 0.0, max: 1.0, step: 0.01 }
						],
						colors: [
							{ key: "obeliskColor",    label: "Base Color" },
							{ key: "obeliskEmissive", label: "Emissive Color" }
						]
					}
				];

				sections.forEach((section) => {
					const sec = document.createElement("div");
					sec.className = "style-section";
					const title = document.createElement("div");
					title.className = "style-section-title";
					title.textContent = section.title;
					sec.appendChild(title);

					(section.sliders || []).forEach((cfg) => {
						const row = document.createElement("div");
						row.className = "style-row";
						row.innerHTML = `
							<label for="st-${cfg.key}">${cfg.label}</label>
							<span class="val" id="st-${cfg.key}-val"></span>
							<input type="range" id="st-${cfg.key}"
								min="${cfg.min}" max="${cfg.max}" step="${cfg.step}"
								value="${styleState[cfg.key]}">
						`;
						sec.appendChild(row);
						const input = row.querySelector("input");
						const valEl = row.querySelector(".val");
						const fmt = (v) => cfg.step < 0.01 ? v.toFixed(3) : v.toFixed(2);
						valEl.textContent = fmt(styleState[cfg.key]);
						input.addEventListener("input", () => {
							const v = parseFloat(input.value);
							styleState[cfg.key] = v;
							valEl.textContent = fmt(v);
							applyStyleState();
						});
					});

					(section.colors || []).forEach((cfg) => {
						const row = document.createElement("div");
						row.className = "style-row";
						row.innerHTML = `
							<label for="st-${cfg.key}">${cfg.label}</label>
							<input type="color" id="st-${cfg.key}" value="${styleState[cfg.key]}">
						`;
						sec.appendChild(row);
						const input = row.querySelector("input");
						input.addEventListener("input", () => {
							styleState[cfg.key] = input.value;
							applyStyleState();
						});
					});

					body.appendChild(sec);
				});

				const copyBtn = document.createElement("button");
				copyBtn.type = "button";
				copyBtn.className = "copy-btn";
				copyBtn.textContent = "Copy Values";
				copyBtn.addEventListener("click", async () => {
					const out = JSON.stringify(styleState, null, 2);
					try {
						await navigator.clipboard.writeText(out);
						copyBtn.classList.add("copied");
						copyBtn.textContent = "Copied!";
						setTimeout(() => {
							copyBtn.classList.remove("copied");
							copyBtn.textContent = "Copy Values";
						}, 1200);
					} catch (err) {
						copyBtn.textContent = "See console";
					}
					console.log("=== Style Tuner Values ===");
					console.log(out);
				});
				body.appendChild(copyBtn);

				toggle.addEventListener("click", () => {
					const isCollapsed = panel.classList.toggle("collapsed");
					toggle.textContent = isCollapsed ? "Show" : "Hide";
				});

				applyStyleState();
			}

			function applyStyleState() {
				if (renderer) renderer.toneMappingExposure = styleState.toneMappingExposure;

				if (cinematicPass?.material?.uniforms) {
					const u = cinematicPass.material.uniforms;
					u.u_exposure.value       = styleState.cinematicExposure;
					u.u_gamma.value          = styleState.gamma;
					u.u_tightGlowMix.value   = styleState.tightGlowMix;
					u.u_streakGlowMix.value  = styleState.streakGlowMix;
					u.u_glowSpread.value     = styleState.glowSpread;
					u.u_glowThreshold.value  = styleState.glowThreshold;
					u.u_glowTint.value.set(styleState.glowTint);
				}

				if (coreMaterial?.uniforms) {
					const u = coreMaterial.uniforms;
					u.u_alphaScale.value   = styleState.coreAlphaScale;
					u.u_maxSizeMul.value   = styleState.maxSizeMul;
					u.u_auraStrength.value = styleState.auraStrength;
					u.u_colorBright.value.set(styleState.colorBright);
					u.u_glowColor.value.set(styleState.glowColor);
					u.u_colorDeep.value.set(styleState.colorDeep);
				}

				if (hazeMaterial?.uniforms) {
					const u = hazeMaterial.uniforms;
					u.u_alphaScale.value   = styleState.hazeAlphaScale;
					u.u_maxSizeMul.value   = styleState.maxSizeMul;
					u.u_auraStrength.value = styleState.auraStrength;
				}

				if (scene?.fog) scene.fog.density = styleState.fogDensity;

				if (bloomPass) {
					bloomPass.strength  = styleState.bloomStrength;
					bloomPass.radius    = styleState.bloomRadius;
					bloomPass.threshold = styleState.bloomThreshold;
				}

				if (logoMaterials && logoMaterials.length) {
					logoMaterials.forEach((m) => {
						if (m.color) m.color.set(styleState.obeliskColor);
						if (m.emissive) m.emissive.set(styleState.obeliskEmissive);
						m.emissiveIntensity = styleState.obeliskEmissiveIntensity;
						m.metalness = styleState.obeliskMetalness;
						m.roughness = styleState.obeliskRoughness;
						if ("clearcoat" in m) m.clearcoat = styleState.obeliskClearcoat;
					});
				}
			}

			async function boot() {
				const startup = runStartupChecks();
				if (!startup.ok) {
					throw new Error(startup.fatalMessage);
				}

				// Log device capability for debugging
				console.log(`Device tier: ${deviceTier} | Memory: ${navigator.deviceMemory || 'unknown'}GB | Cores: ${navigator.hardwareConcurrency || 'unknown'}`);
				console.log(`Particle grid: ${OCEAN_GRID_X}x${OCEAN_GRID_Z} = ${(OCEAN_GRID_X * OCEAN_GRID_Z).toLocaleString()} particles`);
				console.log(`Postprocessing: ${!FORCE_SKIP_POSTPROCESSING ? 'enabled' : 'disabled'}`);
				console.log(`Gyroscope: ${canUseGyroCamera() ? 'available' : 'not available'}`);

				initStaticVectors();
				initRenderer();
				initScene();
				addLighting();
				await addLogoModel();
				addParticleOcean();
				syncObeliskUniforms();
				addAtmosphericShafts();
					initComposer();
					setPerfOverlayVisibility();
					setupStyleTuner();
					setupGyroCameraAccess();
					window.addEventListener("keydown", onPoseKeydown);
					window.addEventListener("pointermove", onPointerMove, { passive: true });
				window.addEventListener("pointerdown", onPointerDown, { passive: true });
				window.addEventListener("pointerup", onPointerRelease, { passive: true });
				window.addEventListener("pointercancel", onPointerRelease, { passive: true });
				canvas.addEventListener("pointerleave", onPointerRelease, { passive: true });
				window.addEventListener("resize", resize);
				window.addEventListener("orientationchange", resize);
				window.visualViewport?.addEventListener("resize", resize, { passive: true });
				animate();
			}

			boot().catch((error) => {
				showSupportMessage(
					error && error.message
						? `This scene could not initialize. ${error.message}`
						: "This scene could not initialize. Verify WebGL support and required Three.js postprocessing scripts."
				);
				console.error(error);
			});
		})();
	</script>
</body>
</html>
